-label,.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.kpi-value{font-size:28px;font-weight:770;margin-top:5px}.detail{display:none}.detail.active{display:block}.back{margin-bottom:12px}.cap-strip{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}.cap{padding:5px 9px;background:var(--soft);border-radius:999px;font-size:11px;font-weight:700}.cap.off{opacity:.4}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.category{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.category h3{font-size:15px;margin:0 0 12px}.category-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kv{background:var(--soft);border-radius:11px;padding:11px}.kv span{display:block;color:var(--muted);font-size:11px}.kv strong{font-size:18px}.thermal-path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.thermal-node{background:var(--soft);padding:14px;border-radius:14px}.thermal-node strong{font-size:22px;display:block}.thermal-node span{font-size:12px;color:var(--muted)}.delta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.delta{border:1px solid var(--line);border-radius:12px;padding:12px}.notice{padding:12px 14px;background:var(--soft);border-radius:12px;color:var(--muted);margin-bottom:14px}.notice.warn{color:var(--warn);font-weight:650}.table-wrap{overflow:auto}.sensor-table,.event-table{width:100%;border-collapse:collapse}.sensor-table th,.sensor-table td,.event-table th,.event-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.sensor-table th,.event-table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.pill{padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:700}.pill.attention{color:var(--warn)}.pill.critical{color:var(--bad)}.empty{padding:30px;text-align:center;color:var(--muted)}.asset-manage{display:grid;grid-template-columns:minmax(170px,220px) 1fr auto;gap:10px;align-items:end}.asset-manage label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:5px}.footer{margin-top:24px;color:var(--muted);font-size:12px}.chart{height:220px}.chart svg{width:100%;height:100%}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:1050px){.systems{grid-template-columns:repeat(2,1fr)}.grid5{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.wrap{padding:15px}.top{flex-direction:column}.systems,.category-grid{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(2,1fr)}.thermal-path,.delta-row{grid-template-columns:repeat(2,1fr)}.asset-manage{grid-template-columns:1fr}}@media(max-width:520px){.metrics,.category-metrics,.grid5,.thermal-path,.delta-row{grid-template-columns:repeat(2,1fr)}.title{font-size:25px}}

<body><div class="wrap">
<div class="top">

</div>

  </div>
</div>

  <button class="back" id="back" data-i18n="back">← Visão geral</button>

</div>

<div class="footer">Seiden Flow {{ version }} · ITA 0.3.1 · <span data-i18n="agnostic">Modelo adaptativo e agnóstico de fabricante</span></div>
</div>

<script>

const BASE={{ ingress_path|tojson }}, REFRESH=Math.max(10,{{ refresh_seconds|default(30)|int }})*1000;
const $=id=>document.getElementById(id),api=p=>BASE+p;
let currentId=null,currentSource=null;

const T={

const lang=()=>window.SeidenUXLocale?window.SeidenUXLocale():'pt-BR';
const tr=k=>(T[lang()]||T['pt-BR'])[k]||k;
const n=(v,d=1)=>v==null?'—':Number(v).toLocaleString(lang(),{maximumFractionDigits:d});
const pct=v=>v==null?'—':n(v,1)+'%';
const temp=v=>v==null?'—':n(v,1)+' °C';
const power=v=>v==null?'—':n(v,0)+' W';

function bytes(v){if(v==null)return'—';let x=Number(v),u=['B','KB','MB','GB','TB'],i=0;while(Math.abs(x)>=1024&&i<u.length-1){x/=1024;i++}return n(x,i?1:0)+' '+u[i]}
function duration(v){if(v==null)return'—';let s=Number(v),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d?`${n(d,0)} d ${n(h,0)} h`:h?`${n(h,0)} h ${n(m,0)} min`:`${n(m,0)} min`}
function fmtTime(v){if(!v)return'—';try{return new Intl.DateTimeFormat(lang(),{dateStyle:'short',timeStyle:'medium'}).format(new Date(v))}catch{return v}}
function stateLabel(s){return s==='critical'?tr('criticalState'):s==='attention'?tr('attentionState'):s==='stale'?tr('staleState'):tr('normalState')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function applyI18n(){document.documentElement.lang=lang();document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n))}
function fmtCard(c){if(!c)return'—';if(c.format==='percent')return pct(c.value);if(c.format==='temperature'||c.format==='temperature_delta')return temp(c.value);if(c.format==='power')return power(c.value);if(c.format==='duration')return duration(c.value);if(c.format==='integer')return n(c.value,0);if(c.format==='ratio')return String(c.value??'—');return n(c.value,2)}
function capLabel(k){
 const known={host_cpu_temperature:'cpuTemp',host_uptime:'uptime',host_storage:'storage',platform_runtime_stats:'platformRuntime',zigbee_inventory_integrity:'zigbee'};
 return tr(known[k]||k);
}
function kv(label,value,note=''){return`<div class="kv"><span>${label}</span><strong>${value}</strong>${note?`<span>${note}</span>`:''}</div>`}
function category(title,body){return body?`<div class="category"><h3>${title}</h3><div class="category-metrics">${body}</div></div>`:''}

function mapPulseState(a){
 if(a.connection_state==='offline')return'stale';
 if(a.connection_state==='degraded')return'attention';
 if(a.highest_alert_severity==='critical')return'critical';
 if(a.highest_alert_severity==='warning')return'attention';
 return'normal';
}
function pulseCards(a){
 const s=a.summary||{},h=s.host||{},z=s.zigbee||{},ap=s.apps||{},cards=[];
 if(h.cpu_temperature_available&&h.cpu_temperature_c!=null)cards.push({key:'cpuTemp',value:h.cpu_temperature_c,format:'temperature'});
 if(h.disk_used_percent!=null)cards.push({key:'disk',value:h.disk_used_percent,format:'percent'});
 if(h.uptime_seconds!=null)cards.push({key:'uptime',value:h.uptime_seconds,format:'duration'});
 if(z.available!==false&&z.total!=null)cards.push({key:'zigbee',value:`${z.online??'—'} / ${z.total}`,format:'ratio'});
 if(cards.length<4&&ap.total!=null)cards.push({key:'apps',value:`${ap.started??'—'} / ${ap.total}`,format:'ratio'});
 return cards.slice(0,4);
}
function normalizePulse(a){
 const s=a.summary||{},asset=s.asset||{};
 return{
   source:'pulse',id:a.pulse_id,state:mapPulseState(a),
   system:{system_id:a.pulse_id,system_name:a.asset_name||asset.name||a.hostname||a.pulse_id,
     connection_name:`${tr('pulseSource')} · ${asset.operating_system||'CAST'}${asset.architecture?' · '+asset.architecture:''}`,
     connector:'pulse',last_seen:a.last_seen_at},
   primary_cards:pulseCards(a),raw:a
 };
}
function normalizeLocal(x){return{source:'local',id:x.system.system_id,state:x.state,system:x.system,primary_cards:x.primary_cards||[],raw:x}}

function renderOverview(items,updatedAt){
 const counts={normal:0,attention:0,critical:0,stale:0};
 items.forEach(x=>counts[x.state]=(counts[x.state]||0)+1);
 $('kpis').innerHTML=[['systems',items.length],['normal',counts.normal],['attention',counts.attention],['critical',counts.critical],['stale',counts.stale]]
   .map(([k,v])=>`<div class="card"><div class="kpi-label">${tr(k)}</div><div class="kpi-value">${v}</div></div>`).join('');
 $('updated').textContent=tr('updated')+' '+fmtTime(updatedAt);
 $('systems').innerHTML=items.length?items.map(x=>{
   const s=x.system,cards=x.primary_cards||[],badge=x.source==='pulse'?tr('pulseSource'):tr('bridgeSource');
   return`<div class="card system-card" data-source="${x.source}" data-id="${escapeHtml(x.id)}">
     <div class="system-head"><div><div class="system-name">${escapeHtml(s.system_name)}</div><div class="system-meta">${escapeHtml(s.connection_name||s.connector||'')}</div><span class="source-badge ${x.source}">${escapeHtml(badge)}</span></div>
     <span class="state ${x.state}"><span class="dot"></span>${stateLabel(x.state)}</span></div>
     <div class="metrics">${cards.map(c=>`<div class="metric"><span>${tr(c.key)}</span><b>${fmtCard(c)}</b></div>`).join('')}</div>
     <div class="system-meta" style="margin-top:12px">${tr('latest')}: ${fmtTime(s.last_seen)} · ${tr('details')} →</div>
   </div>`}).join(''):`<div class="card empty">${tr('noData')}</div>`;
 document.querySelectorAll('.system-card').forEach(e=>e.onclick=()=>e.dataset.source==='pulse'?openPulse(e.dataset.id):openSystem(e.dataset.id));
}

function thresholdInfo(m){const th=m.thresholds||{},r=+m.reading,c=[];for(const [k,v] of Object.entries(th)){if(v&&v.reading!=null){const x=+v.reading;if((k.startsWith('Upper')&&x>r)||(k.startsWith('Lower')&&x<r))c.push([Math.abs(x-r),k,x])}}if(!c.length)return'—';c.sort((a,b)=>a[0]-b[0]);return`${c[0][1]} ${n(c[0][2],1)} ${m.units||''}`}
function eventName(v){return v==='sensor_state_changed'?(lang()==='en-US'?'Sensor state changed':'Mudança de estado do sensor'):v==='telemetry_recovered'?(lang()==='en-US'?'Telemetry recovered':'Telemetria recuperada'):v==='asset_status_changed'?(lang()==='en-US'?'Asset status changed':'Status do ativo alterado'):v}
function formatMeasurement(m){if(m.metric_kind?.endsWith('_bytes'))return bytes(m.reading);if(m.metric_kind?.endsWith('_pct')||m.metric_kind==='fan_speed')return pct(m.reading);if(m.metric_kind==='uptime_seconds')return duration(m.reading);if(m.metric_kind==='temperature')return temp(m.reading);if(m.metric_kind==='power')return power(m.reading);return`${n(m.reading,2)} ${escapeHtml(m.units||'')}`}

/* Existing Bridge/local ITA detail path, intentionally preserved. */
async function openSystem(id){
 currentId=id;currentSource='local';
 const [cr,er]=await Promise.all([
   fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/current'),{cache:'no-store'}),
   fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/events?limit=50'),{cache:'no-store'})
 ]);
 if(!cr.ok)return;
 const d=await cr.json(),ev=er.ok?await er.json():{items:[]},s=d.system,c=d.capabilities||{};
 $('overview').style.display='none';$('detail').classList.add('active');
 let cats='';
 if(c.compute)cats+=category(tr('compute'),kv(tr('load_1m'),n(d.load_1m,2))+kv(tr('load5'),n(d.load_5m,2))+kv(tr('load15'),n(d.load_15m,2))+kv(tr('processes'),n(d.process_count,0))+(d.cpu_used_pct!=null?kv(tr('cpu_usage'),pct(d.cpu_used_pct)):''));
 if(c.memory)cats+=category(tr('memory'),kv(tr('memory_used'),pct(d.memory_used_pct))+kv(tr('memoryAvailable'),bytes(d.memory_available_bytes))+kv(tr('swap_used'),pct(d.swap_used_pct)));
 if(c.storage)cats+=category(tr('storage'),kv(tr('storage_used'),pct(d.storage_used_pct))+kv(tr('diskAvailable'),bytes(d.storage_available_bytes)));
 if(c.network)cats+=category(tr('network'),kv(tr('networkRx'),bytes(d.network_rx_bytes))+kv(tr('networkTx'),bytes(d.network_tx_bytes)));
 if(c.availability)cats+=category(tr('availability'),kv(tr('uptime'),duration(d.uptime_seconds))+kv(tr('freshness'),d.freshness?.stale?tr('staleState'):tr('fresh')));
 if(c.power||c.cooling)cats+=category(tr('powerCooling'),(c.power?kv(tr('power'),power(d.power_w))+kv(tr('powerUse'),pct(d.power_utilization_pct)):'')+(c.cooling?kv(tr('fan_avg'),pct(d.fan_avg_pct))+kv(tr('fanSpread'),pct(d.fan_spread_pct)):''));
 const thermal=c.thermal?`<div class="section"><div class="section-head"><h2>${tr('thermalPath')}</h2></div><div class="thermal-path"><div class="thermal-node"><span>${tr('ambient')}</span><strong>${temp(d.ambient_c)}</strong></div><div class="thermal-node"><span>${tr('intake')}</span><strong>${temp(d.intake_c)}</strong></div><div class="thermal-node"><span>${tr('hottest_cpu')}</span><strong>${temp(d.cpu_c)}</strong></div><div class="thermal-node"><span>${tr('exhaust')}</span><strong>${temp(d.exhaust_c)}</strong></div></div><div class="delta-row"><div class="delta"><span class="muted">${tr('ambientIntake')}</span><br><b>${temp(d.deltas?.ambient_to_intake_c)}</b></div><div class="delta"><span class="muted">${tr('intakeCpu')}</span><br><b>${temp(d.deltas?.intake_to_cpu_c)}</b></div><div class="delta"><span class="muted">${tr('intakeExhaust')}</span><br><b>${temp(d.deltas?.intake_to_exhaust_c)}</b></div></div></div>`:'';
 $('detailBody').innerHTML=`<div class="section-head"><div><h2 style="font-size:22px;margin:0">${escapeHtml(s.system_name)}</h2><div class="muted">${escapeHtml(s.system_id)} · ${escapeHtml(s.connection_name||'')} · ${fmtTime(s.last_seen)}</div><span class="source-badge bridge">${tr('bridgeSource')}</span><div class="cap-strip">${Object.entries(c).filter(([,v])=>v).map(([k])=>`<span class="cap">${capLabel(k)}</span>`).join('')}</div></div><span class="state ${d.state}"><span class="dot"></span>${stateLabel(d.state)}</span></div>
 ${d.freshness?.stale?`<div class="notice warn">${tr('staleState')} · ${tr('age')} ${n(d.freshness.age_seconds,0)} ${tr('seconds')}</div>`:''}
 <div class="notice">${tr('native')}</div>
 <div class="section card"><div class="section-head"><h2>${tr('manageAsset')}</h2></div><div class="asset-manage"><div><label>${tr('assetStatus')}</label><select id="assetStatusControl"><option value="active" ${(s.status||'active')==='active'?'selected':''}>${tr('assetActive')}</option><option value="hidden" ${s.status==='hidden'?'selected':''}>${tr('assetHidden')}</option><option value="decommissioned" ${s.status==='decommissioned'?'selected':''}>${tr('assetDecommissioned')}</option></select></div><div><label>${tr('statusReason')}</label><input id="assetStatusReason" maxlength="500" value="${escapeHtml(s.status_reason||'')}"></div><button id="saveAssetStatus">${tr('saveStatus')}</button></div><div class="system-meta" style="margin-top:8px">${tr('assetHistoryNotice')}</div></div>
 ${thermal}
 <div class="section"><div class="section-head"><h2>${tr('capabilities')}</h2></div><div class="category-grid">${cats}</div></div>
 <div class="section"><div class="section-head"><h2>${tr('history')}</h2></div><div class="card"><div id="chart" class="chart"></div><div id="legend" class="legend"></div></div></div>
 <div class="section"><div class="section-head"><h2>${tr('events')}</h2></div><div class="card table-wrap">${(ev.items||[]).length?`<table class="event-table"><thead><tr><th>${tr('when')}</th><th>${tr('event')}</th><th>${tr('sensor')}</th><th>${tr('transition')}</th></tr></thead><tbody>${ev.items.map(e=>`<tr><td>${fmtTime(e.occurred_at)}</td><td><span class="pill ${e.severity}">${escapeHtml(eventName(e.event_type))}</span></td><td>${escapeHtml(e.sensor_name||e.sensor_id||'—')}</td><td>${escapeHtml(e.previous_state||'—')} → ${escapeHtml(e.current_state||'—')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${tr('noEvents')}</div>`}</div></div>
 <div class="section"><div class="section-head"><h2>${tr('sensors')}</h2></div><div class="card table-wrap"><table class="sensor-table"><thead><tr><th>${tr('sensor')}</th><th>${tr('context')}</th><th>${tr('reading')}</th><th>${tr('health')}</th><th>${tr('threshold')}</th></tr></thead><tbody>${(d.measurements||[]).map(m=>`<tr><td><b>${escapeHtml(m.sensor_name)}</b><div class="muted">${escapeHtml(m.sensor_id)}</div></td><td>${escapeHtml(m.physical_context)}</td><td>${formatMeasurement(m)}</td><td><span class="pill ${m.severity}">${escapeHtml(m.health||'—')}</span></td><td>${escapeHtml(thresholdInfo(m))}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('saveAssetStatus').onclick=()=>saveAssetStatus(id);loadHistory(id);
}

function runtimeBlock(title,r){
 r=r||{};
 return category(title,
   kv(tr('cpuRuntime'),r.cpu_percent!=null?pct(r.cpu_percent):'—')+
   kv(tr('memoryRuntime'),r.memory_usage!=null?bytes(r.memory_usage):'—',r.memory_percent!=null?pct(r.memory_percent):'')+
   kv(tr('networkRuntime'),`${bytes(r.network_rx)} ↓ / ${bytes(r.network_tx)} ↑`)+
   kv(tr('ioRuntime'),`${bytes(r.blk_read)} R / ${bytes(r.blk_write)} W`)
 );
}
function platformItems(platform){
 const values=Object.values(platform||{}).filter(Boolean);
 if(!values.length)return'<div class="muted">—</div>';
 return`<div class="platform-list">${values.map(x=>`<div class="platform-item"><span>${escapeHtml(x.name||x.slug||'App')}</span><strong>${escapeHtml(x.state||'—')}</strong><span>${escapeHtml(x.version||'—')}${x.update_available?' · update':''}</span></div>`).join('')}</div>`;
}

/* Pulse/CAST detail uses Receiver canonical state but lives inside the same ITA. */
async function openPulse(id){
 currentId=id;currentSource='pulse';
 const r=await fetch(api('/api/v1/ita/fleet/'+encodeURIComponent(id)),{cache:'no-store'});
 if(!r.ok)return;
 const a=await r.json(),s=a.summary||{},h=s.host||{},z=s.zigbee||{},ap=s.apps||{},b=s.backups||{},rt=s.platform_runtime||{},perf=s.collection_performance||{};
 const state=mapPulseState(a),caps=s.capabilities||[],alerts=a.alerts||[],asset=s.asset||{};
 $('overview').style.display='none';$('detail').classList.add('active');
 const hostBody=
   kv(tr('cpuTemp'),h.cpu_temperature_available?temp(h.cpu_temperature_c):'—')+
   kv(tr('uptime'),duration(h.uptime_seconds))+
   kv(tr('disk'),pct(h.disk_used_percent),`${n(h.disk_used_gb,1)} / ${n(h.disk_total_gb,1)} GB`)+
   kv(tr('diskAvailable'),h.disk_free_gb!=null?n(h.disk_free_gb,1)+' GB':'—',h.disk_life_time_percent!=null?`${tr('diskLife')}: ${pct(h.disk_life_time_percent)}`:'');
 const zigbeeBody=
   kv(tr('online'),`${n(z.online,0)} / ${n(z.total,0)}`,`${n(z.offline,0)} ${tr('offline')} · ${n(z.unknown,0)} ${tr('unknown')}`)+
   kv(tr('expected'),n(z.expected,0),`${n(z.missing,0)} ${tr('missing')} · ${n(z.new,0)} ${tr('newDevices')}`)+
   kv(tr('routers'),n(z.routers,0))+kv(tr('endDevices'),n(z.end_devices,0));
 const appsBody=
   kv(tr('totalApps'),n(ap.total,0))+kv(tr('runningApps'),n(ap.started,0),`${n(ap.stopped,0)} ${tr('stoppedApps').toLowerCase()}`);
 const backupsBody=kv(tr('backups'),n(b.count,0))+kv(tr('latestBackup'),b.latest_age_hours==null?'—':n(b.latest_age_hours,1)+' h');
 const managed=rt.managed_apps||{};
 const managedBody=category(tr('managedApps'),
   kv(tr('runningApps'),n(managed.apps_with_stats,0))+
   kv(tr('cpuRuntime'),managed.cpu_percent_sum!=null?pct(managed.cpu_percent_sum):'—')+
   kv(tr('memoryRuntime'),bytes(managed.memory_usage_bytes_sum))+
   kv(tr('networkRuntime'),`${bytes(managed.network_rx_bytes_sum)} ↓ / ${bytes(managed.network_tx_bytes_sum)} ↑`)
 );
 const perfBody=Object.entries(perf).slice(0,10).map(([k,v])=>kv(escapeHtml(k.replaceAll('_',' ')),typeof v==='number'?n(v,2)+' s':escapeHtml(v))).join('');
 $('detailBody').innerHTML=`
 <div class="section-head"><div><h2 style="font-size:22px;margin:0">${escapeHtml(a.asset_name||asset.name||a.hostname||a.pulse_id)}</h2>
   <div class="muted">${tr('tenant')}: ${escapeHtml(a.tenant_id)} · ${tr('hostname')}: ${escapeHtml(a.hostname||'—')} · ${tr('pulseVersion')} ${escapeHtml(a.pulse_version||'—')}</div>
   <span class="source-badge pulse">${tr('pulseSource')}</span>
   <div class="cap-strip">${caps.map(k=>`<span class="cap">${escapeHtml(capLabel(k))}</span>`).join('')}</div>
 </div><span class="state ${state}"><span class="dot"></span>${stateLabel(state)}</span></div>
 <div class="notice">${tr('latest')}: ${fmtTime(a.last_seen_at)} · ${tr('lastSnapshot')}: ${fmtTime(a.last_snapshot_at)} · ${tr('lastHeartbeat')}: ${fmtTime(a.last_heartbeat_at)}</div>
 <div class="section"><div class="category-grid">
   ${category(tr('hostHealth'),hostBody)}
   ${category(tr('zigbee'),zigbeeBody)}
   ${category(tr('apps'),appsBody)}
   ${category(tr('backup'),backupsBody)}
 </div></div>
 <div class="section"><div class="section-head"><h2>${tr('platformRuntime')}</h2></div><div class="category-grid">
   ${runtimeBlock(tr('coreRuntime'),rt.core)}
   ${runtimeBlock(tr('supervisorRuntime'),rt.supervisor)}
   ${managedBody}
   ${category(tr('collectionPerformance'),perfBody)}
 </div></div>
 <div class="section"><div class="section-head"><h2>${tr('appPlatform')}</h2></div><div class="card">${platformItems(ap.platform)}</div></div>
 <div class="section"><div class="section-head"><h2>${tr('activeAlerts')}</h2></div><div class="card">
   <div class="alert-list">${alerts.length?alerts.map(x=>`<div class="alert-item"><strong>${escapeHtml(x.title||x.key)}</strong><div class="system-meta">${escapeHtml(x.severity||'warning')} · ${fmtTime(x.updated_at)}</div></div>`).join(''):`<div class="muted">${tr('noAlerts')}</div>`}</div>
 </div></div>`;
}

async function saveAssetStatus(id){
 const status=$('assetStatusControl').value,reason=$('assetStatusReason').value;
 if(!confirm(tr('confirmStatus')))return;
 const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/asset-status'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});
 if(!r.ok){alert(tr('statusSaveError'));return}openSystem(id)
}
async function loadHistory(id){const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/history?hours='+$('period').value),{cache:'no-store'});if(r.ok)drawChart((await r.json()).items||[])}
function drawChart(items){
 const el=$('chart'),leg=$('legend');if(!el)return;
 let candidates=items.filter(x=>x.metric_kind==='temperature');
 if(!candidates.length)candidates=items.filter(x=>['memory_used_pct','swap_used_pct','storage_used_pct','cpu_used_pct','load'].includes(x.metric_kind));
 if(!candidates.length){el.innerHTML=`<div class="empty">${tr('noData')}</div>`;leg.innerHTML='';return}
 const groups={};for(const x of candidates){const k=x.sensor_name||x.sensor_id;(groups[k]||(groups[k]=[])).push(x)}
 const selected=Object.entries(groups).slice(0,5),all=selected.flatMap(([,a])=>a).map(x=>({t:+new Date(x.occurred_at),v:+x.reading}));
 const minT=Math.min(...all.map(x=>x.t)),maxT=Math.max(...all.map(x=>x.t)),minV=Math.floor(Math.min(...all.map(x=>x.v))-2),maxV=Math.ceil(Math.max(...all.map(x=>x.v))+2),W=900,H=220,p=32,X=t=>p+(t-minT)/Math.max(1,maxT-minT)*(W-2*p),Y=v=>H-p-(v-minV)/Math.max(1,maxV-minV)*(H-2*p);
 let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="currentColor" opacity=".18"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="currentColor" opacity=".18"/>`;
 const dash=['','8 4','3 3','12 4 3 4','2 5'];
 selected.forEach(([k,a],i)=>{a.sort((x,y)=>new Date(x.occurred_at)-new Date(y.occurred_at));svg+=`<polyline points="${a.map(x=>`${X(+new Date(x.occurred_at))},${Y(+x.reading)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="${2+i*.2}" stroke-dasharray="${dash[i]}" opacity="${.95-i*.1}" vector-effect="non-scaling-stroke"/>`});
 svg+=`<text x="4" y="${p+4}" fill="currentColor" opacity=".55" font-size="11">${maxV}</text><text x="4" y="${H-p}" fill="currentColor" opacity=".55" font-size="11">${minV}</text></svg>`;
 el.innerHTML=svg;leg.innerHTML=selected.map(([k],i)=>`<span>${i===0?'━':i===1?'┄':i===2?'┈':'╍'} ${escapeHtml(k)}</span>`).join('')
}

async function refresh(){
 applyI18n();
 if(currentId&&$('detail').classList.contains('active'))return currentSource==='pulse'?openPulse(currentId):openSystem(currentId);
 const view=$('assetView').value;
 const localPromise=fetch(api('/api/v1/ita/portfolio?view='+encodeURIComponent(view)),{cache:'no-store'});
 const includePulse=(view==='active'||view==='all');
 const pulsePromise=includePulse?fetch(api('/api/v1/ita/fleet'),{cache:'no-store'}):Promise.resolve(null);
 const [lr,pr]=await Promise.all([localPromise,pulsePromise]);

 let items=[],updatedAt=new Date().toISOString();
 if(lr&&lr.ok){
   const local=await lr.json();items.push(...(local.items||[]).map(normalizeLocal));updatedAt=local.updated_at||updatedAt;
 }
 const notice=$('receiverNotice');notice.style.display='none';
 if(includePulse&&pr){
   if(pr.ok){
     const fleet=await pr.json();items.push(...(fleet.assets||[]).map(normalizePulse));
     if(fleet.generated_at)updatedAt=fleet.generated_at;
   }else{
     let err={};try{err=await pr.json()}catch{}
     notice.textContent=err.error==='fleet_not_configured'?tr('receiverNotConfigured'):tr('receiverUnavailable');
     notice.style.display='block';
   }
 }
 renderOverview(items,updatedAt);
}

$('refresh').onclick=refresh;
$('assetView').onchange=()=>{currentId=null;currentSource=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};
$('period').onchange=()=>currentId&&currentSource==='local'?loadHistory(currentId):null;
$('back').onclick=()=>{currentId=null;currentSource=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};
window.addEventListener('storage',()=>{applyI18n();refresh()});
applyI18n();refresh();setInterval(refresh,REFRESH);
})();
</script>
