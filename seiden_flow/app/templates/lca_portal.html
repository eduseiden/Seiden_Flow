<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCA · Seiden One</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17212b;background:#f5f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#687785}.title{font-size:30px;margin:5px 0}.sub{color:#687785}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card,.panel{background:white;border:1px solid #e3e8ec;border-radius:14px;padding:18px;box-shadow:0 3px 14px #16212b0a}.num{font-size:28px;font-weight:700;margin-top:8px}.label{font-size:12px;color:#687785}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 14px}.event{display:grid;grid-template-columns:145px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid #edf0f2;font-size:13px}.badge{padding:4px 8px;border-radius:999px;background:#edf3f5}.device{padding:12px 0;border-top:1px solid #edf0f2;display:flex;justify-content:space-between;gap:12px}.muted{color:#76838e}.attention{color:#9a5b00}.empty{padding:30px;text-align:center;color:#76838e}.footer{display:flex;justify-content:space-between;margin-top:24px;color:#87939d;font-size:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.event{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><div class="eyebrow">Seiden One · Flow</div><h1 class="title">Lighting Context Analytics</h1><div class="sub">Compreensão de eventos, padrões de iluminação e evidências de circulação.</div></div><select id="period"><option value="24">24 horas</option><option value="168">7 dias</option><option value="720">30 dias</option></select></div><div class="cards" id="cards"></div><div class="grid"><section class="panel"><h2>Eventos recentes</h2><div id="events"></div></section><section class="panel"><h2>Dispositivos descobertos</h2><div id="devices"></div></section></div><div class="grid"><section class="panel"><h2>Fontes mais ativas</h2><div id="top"></div></section><section class="panel"><h2>Evidências de rota</h2><div id="routes"></div></section></div><div class="footer"><span>Powered by Seiden One Intelligence</span><span>LCA 0.1.1 · Flow {{version}}</span></div></div><script>
const base={{ingress_path|tojson}};const api=p=>`${base}${p}`;const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium'}).format(new Date(t))}catch{return t}}
async function load(){const h=document.querySelector('#period').value;const [d,dev]=await Promise.all([fetch(api(`/api/v1/lca/dashboard?hours=${h}`)).then(r=>r.json()),fetch(api('/api/v1/lca/devices')).then(r=>r.json())]);const s=d.summary;const vals=[['Eventos relevantes',s.events],['Interações',s.interactions],['Mudanças reais',s.state_changes],['Dispositivos',s.discovered_devices],['A configurar',s.unconfigured_devices],['Sessões abertas',s.open_sessions]];cards.innerHTML=vals.map(x=>`<div class=card><div class=label>${x[0]}</div><div class=num>${x[1]??0}</div></div>`).join('');events.innerHTML=d.recent_events.length?d.recent_events.map(e=>`<div class=event><span class=muted>${fmt(e.occurred_at)}</span><span><b>${esc(e.device_name)}</b> · ${esc(e.channel_key)} ${esc(e.action||e.state||'')}</span><span class=badge>${esc(e.kind)}</span></div>`).join(''):'<div class=empty>Nenhum evento LCA recebido neste período.</div>';devices.innerHTML=dev.items.length?dev.items.map(x=>`<div class=device><div><b>${esc(x.name)}</b><div class=muted>${esc(x.topic)} · ${x.channel_count} canal(is)</div></div><span class="${x.status==='discovered'?'attention':'muted'}">${esc(x.status)}</span></div>`).join(''):'<div class=empty>Aguardando descoberta automática.</div>';top.innerHTML=d.top_devices.length?d.top_devices.map(x=>`<div class=device><span>${esc(x.name)}</span><b>${x.events}</b></div>`).join(''):'<div class=empty>Sem dados.</div>';routes.innerHTML=d.route_evidence.length?d.route_evidence.map(x=>`<div class=device><div>${esc(x.origin_location_name)} → ${esc(x.adjacent_location_name||x.direction_hint)}</div><b>${x.evidence_count}</b></div>`).join(''):'<div class=empty>Configure localização e direção das teclas para formar evidências de rota.</div>'}
period.onchange=load;load();setInterval(load,15000);
</script></body></html>
