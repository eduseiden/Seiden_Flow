function translateString(value){if(locale()!=='en-US'||!value)return value;const leading=(value.match(/^\s*/)||[''])[0],trailing=(value.match(/\s*$/)||[''])[0],core=value.trim();if(!core)return value;if(EN[core])return leading+EN[core]+trailing;let out=core;for(const [rx,repl] of REGEX){if(rx.test(out)){out=out.replace(rx,repl);return leading+out+trailing}}// targeted phrase replacement for compound labels
const phrases=Object.keys(EN).filter(k=>k.length>5).sort((a,b)=>b.length-a.length);for(const k of phrases){if(out.includes(k))out=out.split(k).join(EN[k])}return leading+out+trailing}
function translateNode(root){if(locale()!=='en-US')return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){if(n.parentElement&&['SCRIPT','STYLE','CODE'].includes(n.parentElement.tagName))continue;const v=translateString(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}root.querySelectorAll?.('[title],[aria-label],[placeholder]').forEach(el=>{for(const a of ['title','aria-label','placeholder'])if(el.hasAttribute(a)){const v=translateString(el.getAttribute(a));if(v!==el.getAttribute(a))el.setAttribute(a,v)}})}
function setLanguage(lang){localStorage.setItem(KEY_LANG,lang);document.documentElement.lang=lang;location.reload()}
function installLanguageControl(){if(document.getElementById('seiden-language'))return;const select=document.createElement('select');select.id='seiden-language';select.className='seiden-language-select';select.setAttribute('aria-label','Language');select.title='Language';select.innerHTML='<option value="pt-BR">PT</option><option value="en-US">EN</option>';select.value=locale();select.onchange=()=>setLanguage(select.value);const target=document.querySelector('.toolbar')||document.querySelector('.head-actions')||document.querySelector('.top-actions');if(target)target.insertBefore(select,target.firstChild)}
function normalizeTheme(){let globalTheme=localStorage.getItem(KEY_THEME)||'system';if(globalTheme==='auto'){globalTheme='system';localStorage.setItem(KEY_THEME,'system')}const prefersDark=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=globalTheme==='system'?(prefersDark?'dark':'light'):globalTheme;const el=document.getElementById('theme');if(el){let saved=globalTheme;if([...el.options].some(o=>o.value==='system'))el.value=saved;else if([...el.options].some(o=>o.value==='auto'))el.value=saved==='system'?'auto':saved}document.querySelectorAll('.theme-btn').forEach(b=>{const saved=localStorage.getItem(KEY_THEME)||'system';b.classList.toggle('active',b.dataset.themeChoice===saved)})}
const originalAlert=window.alert.bind(window);window.alert=(message)=>originalAlert(translateString(String(message)));
document.documentElement.lang=locale();installLanguageControl();normalizeTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if((localStorage.getItem(KEY_THEME)||'system')==='system')normalizeTheme()});if(locale()==='en-US'){document.title=document.title.replace('Environmental Intelligence','Environmental Intelligence').replace('Seiden Flow · TCA','Seiden Flow · TCA');translateNode(document.body);const observer=new MutationObserver(muts=>{for(const m of muts)for(const n of m.addedNodes)if(n.nodeType===1||n.nodeType===3)translateNode(n.nodeType===1?n:n.parentElement||document.body)});observer.observe(document.body,{childList:true,subtree:true})}
})();
