configuration:
  api_key:
    name: API key
    description: Optional Bearer token required by ingestion endpoints.
  subscribe_home_assistant_events:
    name: Subscribe to Home Assistant events
    description: Receives Seiden Bridge events directly from the Home Assistant event
      bus.
  human_experience_minimum_samples:
    name: Minimum HEA samples
    description: Minimum valid observations in a window before publishing analytics.
  human_experience_aggregation_window_minutes:
    name: HEA aggregation window
    description: Duration in minutes of each analytics window.
  human_experience_minimum_confidence:
    name: Minimum HEA confidence
    description: Observations below this threshold are discarded.
  observation_retain_raw_minutes:
    name: Raw observation retention
    description: Minutes before anonymous individual observations are permanently
      deleted.
  human_experience_enabled_sources:
    name: HEA enabled sources
    description: List of source_id values. An empty list enables all sources.
  bridge_event:
    name: Unified Bridge event
  connection_online_event:
    name: Connection online event
  connection_offline_event:
    name: Connection offline event
  vision_event:
    name: Seiden Vision event

  ita_fleet_enabled:
    name: "ITA Fleet"
    description: "Enables the central Seiden CAST fleet view."

  ita_fleet_receiver_url:
    name: "Fleet Receiver"
    description: "Local URL of the Seiden Telemetry Receiver."

  ita_fleet_read_token:
    name: "Fleet read token"
    description: "Read token configured in the Telemetry Receiver."

  ita_fleet_timeout_seconds:
    name: "Fleet timeout"
    description: "Receiver query timeout in seconds."

  ita_fleet_refresh_seconds:
    name: "Fleet refresh"
    description: "Fleet screen refresh interval in seconds."

era:
  title: Event Response Automation
  description: Incidents, policies, notifications and recovery
