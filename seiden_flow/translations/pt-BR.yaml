configuration:
  api_key:
    name: Chave da API
    description: Token Bearer opcional exigido pelos endpoints de ingestão.
  subscribe_home_assistant_events:
    name: Assinar eventos do Home Assistant
    description: Recebe eventos do Seiden Bridge diretamente pelo barramento do Home
      Assistant.
  human_experience_minimum_samples:
    name: Mínimo de passagens para HEA
    description: Quantidade mínima de observações válidas na janela antes de publicar
      a análise.
  human_experience_aggregation_window_minutes:
    name: Janela de agregação HEA
    description: Duração, em minutos, de cada período analisado.
  human_experience_minimum_confidence:
    name: Confiança mínima HEA
    description: Observações abaixo deste nível são descartadas.
  observation_retain_raw_minutes:
    name: Retenção das observações brutas
    description: Minutos antes de eliminar definitivamente as observações individuais
      anônimas.
  human_experience_enabled_sources:
    name: Fontes habilitadas no HEA
    description: Lista de source_id. Lista vazia habilita todas as fontes.
  bridge_event:
    name: Evento unificado do Bridge
  connection_online_event:
    name: Evento de conexão online
  connection_offline_event:
    name: Evento de conexão offline
  vision_event:
    name: Evento do Seiden Vision

  ita_fleet_enabled:
    name: "ITA Fleet"
    description: "Habilita a visão central da frota Seiden CAST."

  ita_fleet_receiver_url:
    name: "Receiver Fleet"
    description: "URL local do Seiden Telemetry Receiver."

  ita_fleet_read_token:
    name: "Token de leitura Fleet"
    description: "Token de leitura configurado no Telemetry Receiver."

  ita_fleet_timeout_seconds:
    name: "Timeout Fleet"
    description: "Timeout de consulta ao Receiver, em segundos."

  ita_fleet_refresh_seconds:
    name: "Atualização Fleet"
    description: "Intervalo de atualização da tela Fleet, em segundos."

era:
  title: Event Response Automation
  description: Incidentes, políticas, notificações e recuperação
