</style></head><body><div class="wrap">

'en-US':{title:'Infrastructure Telemetry Analytics',subtitle:'Infrastructure telemetry converted into health, context and operational signals.',refresh:'Refresh',infra:'Monitored infrastructure',back:'← Overview',agnostic:'Adaptive, vendor-agnostic analytical model',systems:'Systems',normal:'Normal',attention:'Attention',critical:'Critical',stale:'No telemetry',latest:'Latest telemetry',details:'Open analysis',state:'State',noData:'No ITA telemetry received yet.',updated:'Updated',fleet:'Fleet',viewActive:'Active',viewAll:'All',viewHidden:'Hidden',viewDecommissioned:'Decommissioned',normalState:'Normal',attentionState:'Attention',criticalState:'Critical',staleState:'Stale telemetry',capabilities:'Detected capabilities',compute:'Compute',memory:'Memory',storage:'Storage',network:'Network',thermal:'Thermal',powerCooling:'Power & cooling',cooling:'Cooling',power:'Power',availability:'Availability',intake:'Air intake',hottest_cpu:'Hottest CPU',thermal_headroom:'Thermal headroom',power:'Power',fan_avg:'Average fan',memory_used:'Memory used',swap_used:'Swap used',storage_used:'Disk used',cpu_usage:'CPU used',load_1m:'Load 1 min',uptime:'Uptime',processes:'Processes',memoryAvailable:'Memory available',diskAvailable:'Disk available',networkRx:'Received',networkTx:'Transmitted',load5:'Load 5 min',load15:'Load 15 min',ambient:'Ambient',exhaust:'Exhaust',fanSpread:'Fan spread',powerUse:'Power range usage',freshness:'Telemetry health',fresh:'Fresh',age:'Collection age',seconds:'s',thermalPath:'Thermal path',ambientIntake:'Ambient → intake',intakeCpu:'Intake → CPU',intakeExhaust:'Intake → exhaust',native:'Native thresholds are preserved as evidence. When the source does not provide them, ITA applies conservative operational guardrails only to broadly interpretable percentage metrics.',history:'Operational evolution',events:'Operational events',sensors:'Normalized raw telemetry',sensor:'Sensor',context:'Context',reading:'Reading',health:'Health',threshold:'Next threshold',when:'W const lang=()=>window.SeidenUXLocale?window.SeidenUXLocale():'pt-BR',tr=k=>(T[lang()]||T['pt-BR'])[k]||k,n=(v,d=1)=>v==null?'—':Number(v).toLocaleString(lang(),{maximumFractionDigits:d}),pct=v=>v==null?'—':n(v,1)+'%',temp=v=>v==null?'—':n(v,1)+' °C',power=v=>v==null?'—':n(v,0)+' W';
function bytes(v){if(v==null)return'—';let x=Number(v),u=['B','KB','MB','GB','TB'],i=0;while(Math.abs(x)>=1024&&i<u.length-1){x/=1024;i++}return n(x,i?1:0)+' '+u[i]}
function duration(v){if(v==null)return'—';let s=Number(v),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);return d?`${n(d,0)} d ${n(h,0)} h`:`${n(h,0)} h`}
function fmtTime(v){if(!v)return'—';try{return new Intl.DateTimeFormat(lang(),{dateStyle:'short',timeStyle:'medium'}).format(new Date(v))}catch{return v}}
function stateLabel(s){return s==='critical'?tr('criticalState'):s==='attention'?tr('attentionState'):s==='stale'?tr('staleState'):tr('normalState')}
function fmtCard(c){if(!c)return'—';if(c.format==='percent')return pct(c.value);if(c.format==='temperature'||c.format==='temperature_delta')return temp(c.value);if(c.format==='power')return power(c.value);if(c.format==='duration')return duration(c.value);if(c.format==='integer')return n(c.value,0);return n(c.value,2)}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function capLabel(k){return tr(k)}
function applyI18n(){document.documentElement.lang=lang();document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n))}
function renderOverview(d){$('kpis').innerHTML=[['systems',d.total],['normal',d.counts.normal||0],['attention',d.counts.attention||0],['critical',d.counts.critical||0],['stale',d.counts.stale||0]].map(([k,v])=>`<div class="card"><div class="kpi-label">${tr(k)}</div><div class="kpi-value">${v}</div></div>`).join('');$('updated').textContent=tr('updated')+' '+fmtTime(d.updated_at);$('systems').innerHTML=(d.items||[]).length?(d.items||[]).map(x=>{const s=x.system,cards=x.primary_cards||[];return`<div class="card system-card" data-id="${escapeHtml(s.system_id)}"><div class="system-head"><div><div class="system-name">${escapeHtml(s.system_name)}</div><div class="system-meta">${escapeHtml(s.connection_name||s.connector||'')}</div></div><span class="state ${x.state}"><span class="dot"></span>${stateLabel(x.state)}</span></div><div class="metrics">${cards.map(c=>`<div class="metric"><span>${tr(c.key)}</span><b>${fmtCard(c)}</b></div>`).join('')}</div><div class="system-meta" style="margin-top:12px">${tr('latest')}: ${fmtTime(s.last_seen)} · ${tr('details')} →</div></div>`}).join(''):`<div class="card empty">${tr('noData')}</div>`;document.querySelectorAll('.system-card').forEach(e=>e.onclick=()=>openSystem(e.dataset.id))}

function category(title,body){return body?`<div class="category"><h3>${title}</h3><div class="category-metrics">${body}</div></div>`:''}
function thresholdInfo(m){const th=m.thresholds||{},r=+m.reading,c=[];for(const [k,v] of Object.entries(th)){if(v&&v.reading!=null){const x=+v.reading;if((k.startsWith('Upper')&&x>r)||(k.startsWith('Lower')&&x<r))c.push([Math.abs(x-r),k,x])}}if(!c.length)return'—';c.sort((a,b)=>a[0]-b[0]);return`${c[0][1]} ${n(c[0][2],1)} ${m.units||''}`}
function eventName(v){return v==='sensor_state_changed'?(lang()==='en-US'?'Sensor state changed':'Mudança de estado do sensor'):v==='telemetry_recovered'?(lang()==='en-US'?'Telemetry recovered':'Telemetria recuperada'):v==='asset_status_changed'?(lang()==='en-US'?'Asset status changed':'Status do ativo alterado'):v}
async function openSystem(id){currentId=id;const [cr,er]=await Promise.all([fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/current'),{cache:'no-store'}),fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/events?limit=50'),{cache:'no-store'})]);if(!cr.ok)return;const d=await cr.json(),ev=er.ok?await er.json():{items:[]},s=d.system,c=d.capabilities||{};$('overview').style.display='none';$('detail').classList.add('active');
let cats='';if(c.compute)cats+=category(tr('compute'),kv(tr('load_1m'),n(d.load_1m,2))+kv(tr('load5'),n(d.load_5m,2))+kv(tr('load15'),n(d.load_15m,2))+kv(tr('processes'),n(d.process_count,0))+ (d.cpu_used_pct!=null?kv(tr('cpu_usage'),pct(d.cpu_used_pct)):''));if(c.memory)cats+=category(tr('memory'),kv(tr('memory_used'),pct(d.memory_used_pct))+kv(tr('memoryAvailable'),bytes(d.memory_available_bytes))+kv(tr('swap_used'),pct(d.swap_used_pct)));if(c.storage)cats+=category(tr('storage'),kv(tr('storage_used'),pct(d.storage_used_pct))+kv(tr('diskAvailable'),bytes(d.storage_available_bytes)));if(c.network)cats+=category(tr('network'),kv(tr('networkRx'),bytes(d.network_rx_bytes))+kv(tr('networkTx'),bytes(d.network_tx_bytes)));if(c.availability)cats+=category(tr('availability'),kv(tr('uptime'),duration(d.uptime_seconds))+kv(tr('freshness'),d.freshness?.stale?tr('staleState'):tr('fresh')));if(c.power||c.cooling)cats+=category(tr('powerCooling'),(c.power?kv(tr('power'),power(d.power_w))+kv(tr('powerUse'),pct(d.power_utilization_pct)):'')+(c.cooling?kv(tr('fan_avg'),pct(d.fan_avg_pct))+kv(tr('fanSpread'),pct(d.fan_spread_pct)):''));
const thermal=c.thermal?`<div class="section"><div class="section-head"><h2>${tr('thermalPath')}</h2></div><div class="thermal-path"><div class="thermal-node"><span>${tr('ambient')}</span><strong>${temp(d.ambient_c)}</strong></div><div class="thermal-node"><span>${tr('intake')}</span><strong>${temp(d.intake_c)}</strong></div><div class="thermal-node"><span>${tr('hottest_cpu')}</span><strong>${temp(d.cpu_c)}</strong></div><div class="thermal-node"><span>${tr('exhaust')}</span><strong>${temp(d.exhaust_c)}</strong></div></div><div class="delta-row"><div class="delta"><span class="muted">${tr('ambientIntake')}</span><br><b>${temp(d.deltas?.ambient_to_intake_c)}</b></div><div class="delta"><span class="muted">${tr('intakeCpu')}</span><br><b>${temp(d.deltas?.intake_to_cpu_c)}</b></div><div class="delta"><span class="muted">${tr('intakeExhaust')}</span><br><b>${temp(d.deltas?.intake_to_exhaust_c)}</b></div></div></div>`:'';
$('detailBody').innerHTML=`<div class="section-head"><div><h2 style="font-size:22px;margin:0">${escapeHtml(s.system_name)}</h2><div class="muted">${escapeHtml(s.system_id)} · ${escapeHtml(s.connection_name||'')} · ${fmtTime(s.last_seen)}</div><div class="cap-strip">${Object.entries(c).filter(([,v])=>v).map(([k])=>`<span class="cap">${capLabel(k)}</span>`).join('')}</div></div><span class="state ${d.state}"><span class="dot"></span>${stateLabel(d.state)}</span></div>${d.freshness?.stale?`<div class="notice warn">${tr('staleState')} · ${tr('age')} ${n(d.freshness.age_seconds,0)} ${tr('seconds')}</div>`:''}<div class="notice">${tr('native')}</div><div class="section card"><div class="section-head"><h2>${tr('manageAsset')}</h2></div><div class="asset-manage"><div><label>${tr('assetStatus')}</label><select id="assetStatusControl"><option value="active" ${(s.status||'active')==='active'?'selected':''}>${tr('assetActive')}</option><option value="hidden" ${s.status==='hidden'?'selected':''}>${tr('assetHidden')}</option><option value="decommissioned" ${s.status==='decommissioned'?'selected':''}>${tr('assetDecommissioned')}</option></select></div><div><label>${tr('statusReason')}</label><input id="assetStatusReason" maxlength="500" value="${escapeHtml(s.status_reason||'')}"></div><button id="saveAssetStatus">${tr('saveStatus')}</button></div><div class="system-meta" style="margin-top:8px">${tr('assetHistoryNotice')}</div></div>${thermal}<div class="section"><div class="section-head"><h2>${tr('capabilities')}</h2></div><div class="category-grid">${cats}</div></div><div class="section"><div class="section-head"><h2>${tr('history')}</h2></div><div class="card"><div id="chart" class="chart"></div><div id="legend" class="legend"></div></div></div><div class="section"><div class="section-head"><h2>${tr('events')}</h2></div><div class="card table-wrap">${(ev.items||[]).length?`<table class="event-table"><thead><tr><th>${tr('when')}</th><th>${tr('event')}</th><th>${tr('sensor')}</th><th>${tr('transition')}</th></tr></thead><tbody>${ev.items.map(e=>`<tr><td>${fmtTime(e.occurred_at)}</td><td><span class="pill ${e.severity}">${escapeHtml(eventName(e.event_type))}</span></td><td>${escapeHtml(e.sensor_name||e.sensor_id||'—')}</td><td>${escapeHtml(e.previous_state||'—')} → ${escapeHtml(e.current_state||'—')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${tr('noEvents')}</div>`}</div></div><div class="section"><div class="section-head"><h2>${tr('sensors')}</h2></div><div class="card table-wrap"><table class="sensor-table"><thead><tr><th>${tr('sensor')}</th><th>${tr('context')}</th><th>${tr('reading')}</th><th>${tr('health')}</th><th>${tr('threshold')}</th></tr></thead><tbody>${(d.measurements||[]).map(m=>`<tr><td><b>${escapeHtml(m.sensor_name)}</b><div class="muted">${escapeHtml(m.sensor_id)}</div></td><td>${escapeHtml(m.physical_context)}</td><td>${formatMeasurement(m)}</td><td><span class="pill ${m.severity}">${escapeHtml(m.health||'—')}</span></td><td>${escapeHtml(thresholdInfo(m))}</td></tr>`).join('')}</tbody></table></div></div>`;$('saveAssetStatus').onclick=()=>saveAssetStatus(id);loadHistory(id)}
function formatMeasurement(m){if(m.metric_kind?.endsWith('_bytes'))return bytes(m.reading);if(m.metric_kind?.endsWith('_pct')||m.metric_kind==='fan_speed')return pct(m.reading);if(m.metric_kind==='uptime_seconds')return duration(m.reading);if(m.metric_kind==='temperature')return temp(m.reading);if(m.metric_kind==='power')return power(m.reading);return`${n(m.reading,2)} ${escapeHtml(m.units||'')}`}
async function saveAssetStatus(id){const status=$('assetStatusControl').value,reason=$('assetStatusReason').value;if(!confirm(tr('confirmStatus')))return;const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/asset-status'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});if(!r.ok){alert(tr('statusSaveError'));return}openSystem(id)}
async function loadHistory(id){const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/history?hours='+$('period').value),{cache:'no-store'});if(r.ok)drawChart((await r.json()).items||[])}
function drawChart(items){const el=$('chart'),leg=$('legend');if(!el)return;let candidates=items.filter(x=>x.metric_kind==='temperature');if(!candidates.length)candidates=items.filter(x=>['memory_used_pct','swap_used_pct','storage_used_pct','cpu_used_pct','load'].includes(x.metric_kind));if(!candidates.length){el.innerHTML=`<div class="empty">${tr('noData')}</div>`;leg.innerHTML='';return}const groups={};for(const x of candidates){const k=x.sensor_name||x.sensor_id;(groups[k]||(groups[k]=[])).push(x)};const selected=Object.entries(groups).slice(0,5),all=selected.flatMap(([,a])=>a).map(x=>({t:+new Date(x.occurred_at),v:+x.reading})),minT=Math.min(...all.map(x=>x.t)),maxT=Math.max(...all.map(x=>x.t)),minV=Math.floor(Math.min(...all.map(x=>x.v))-2),maxV=Math.ceil(Math.max(...all.map(x=>x.v))+2),W=900,H=220,p=32,X=t=>p+(t-minT)/Math.max(1,maxT-minT)*(W-2*p),Y=v=>H-p-(v-minV)/Math.max(1,maxV-minV)*(H-2*p);let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="currentColor" opacity=".18"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="currentColor" opacity=".18"/>`;const dash=['','8 4','3 3','12 4 3 4','2 5'];selected.forEach(([k,a],i)=>{a.sort((x,y)=>new Date(x.occurred_at)-new Date(y.occurred_at));svg+=`<polyline points="${a.map(x=>`${X(+new Date(x.occurred_at))},${Y(+x.reading)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="${2+i*.2}" stroke-dasharray="${dash[i]}" opacity="${.95-i*.1}" vector-effect="non-scaling-stroke"/>`});svg+=`<text x="4" y="${p+4}" fill="currentColor" opacity=".55" font-size="11">${maxV}</text><text x="4" y="${H-p}" fill="currentColor" opacity=".55" font-size="11">${minV}</text></svg>`;el.innerHTML=svg;leg.innerHTML=selected.map(([k],i)=>`<span>${i===0?'━':i===1?'┄':i===2?'┈':'╍'} ${escapeHtml(k)}</span>`).join('')}
async function refresh(){applyI18n();if(currentId&&$('detail').classList.contains('active'))return openSystem(currentId);const r=await fetch(api('/api/v1/ita/portfolio?view='+encodeURIComponent($('assetView').value)),{cache:'no-store'});if(r.ok)renderOverview(await r.json())}
$('refresh').onclick=refresh;$('assetView').onchange=()=>{currentId=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};$('period').onchange=()=>currentId?loadHistory(currentId):null;$('back').onclick=()=>{currentId=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};window.addEventListener('storage',()=>{applyI18n();refresh()});applyI18n();refresh();setInterval(refresh,30000)})();
