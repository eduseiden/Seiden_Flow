function translateString(value){if(locale()!=='en-US'||!value)return value;const leading=(value.match(/^\s*/)||[''])[0],trailing=(value.match(/\s*$/)||[''])[0],core=value.trim();if(!core)return value;if(EN[core])return leading+EN[core]+trailing;let out=core;for(const [rx,repl] of REGEX){if(rx.test(out))out=out.replace(rx,repl)}// targeted phrase replacement for compound labels
