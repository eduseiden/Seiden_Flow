<!doctype html>
<html lang="pt-BR"><head><script>window.SeidenUXLocale=()=>localStorage.getItem('seiden-flow-language')==='en-US'?'en-US':'pt-BR';</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seiden Flow · ITA</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--soft:#eef2f7;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--accent:#334155}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--line:#273449;--soft:#172033;--accent:#cbd5e1}}
html[data-theme="light"]{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--soft:#eef2f7;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--accent:#334155}
html[data-theme="dark"]{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--line:#273449;--soft:#172033;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--accent:#cbd5e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1380px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.title{font-size:30px;line-height:1.08;margin:5px 0 5px;font-weight:760}.subtitle{color:var(--muted);max-width:760px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}.kpi-value{font-size:28px;font-weight:760;margin-top:5px}.kpi-note{color:var(--muted);font-size:12px;margin-top:3px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.systems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.system-card{cursor:pointer;transition:.15s}.system-card:hover{transform:translateY(-1px);border-color:#94a3b8}.system-name{font-weight:750;font-size:16px}.system-meta{color:var(--muted);font-size:12px;margin-top:3px}.state{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:var(--soft)}.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}.state.attention .dot{background:var(--warn)}.state.critical .dot{background:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.metric{background:var(--soft);border-radius:12px;padding:11px}.metric b{display:block;font-size:18px;margin-top:2px}.metric span{font-size:11px;color:var(--muted)}.detail{display:none}.detail.active{display:block}.back{margin-bottom:12px}.thermal-path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:stretch}.thermal-node{background:var(--soft);padding:14px;border-radius:14px}.thermal-node strong{font-size:22px;display:block}.thermal-node span{font-size:12px;color:var(--muted)}.delta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.delta{border:1px solid var(--line);border-radius:12px;padding:12px}.delta b{font-size:18px}.table-wrap{overflow:auto}.sensor-table{width:100%;border-collapse:collapse}.sensor-table th,.sensor-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.sensor-table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.pill{padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:700}.pill.attention{color:var(--warn)}.pill.critical{color:var(--bad)}.footer{margin-top:24px;color:var(--muted);font-size:12px}.notice{padding:12px 14px;background:var(--soft);border-radius:12px;color:var(--muted);margin-bottom:14px}.chart{height:220px;width:100%;position:relative}.chart svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
@media(max-width:900px){.wrap{padding:16px}.top{flex-direction:column}.grid{grid-template-columns:repeat(2,1fr)}.systems{grid-template-columns:1fr}.thermal-path,.delta-row{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid,.thermal-path,.delta-row,.metrics{grid-template-columns:1fr 1fr}.title{font-size:25px}.wrap{padding:12px}.card{padding:14px}}
</style></head><body>
<div class="wrap">
  <div class="top"><div><div class="eyebrow">Seiden One · ITA</div><div class="title" data-i18n="title">Infrastructure Thermal Analytics</div><div class="subtitle" data-i18n="subtitle">Saúde térmica, ventilação, energia e comportamento da infraestrutura no mesmo contexto operacional.</div></div><div class="toolbar"><select id="period"><option value="1">1 h</option><option value="6">6 h</option><option value="24" selected>24 h</option><option value="168">7 d</option><option value="720">30 d</option></select><button id="refresh" data-i18n="refresh">Atualizar</button></div></div>
  <div id="overview">
    <div class="grid" id="kpis"></div>
    <div class="section"><div class="section-head"><h2 data-i18n="infra">Infraestrutura monitorada</h2><span id="updated" class="muted"></span></div><div id="systems" class="systems"></div></div>
  </div>
  <div id="detail" class="detail"><button class="back" id="back" data-i18n="back">← Visão geral</button><div id="detailBody"></div></div>
  <div class="footer">Seiden Flow {{ version }} · ITA 0.1.0 · <span data-i18n="agnostic">Modelo analítico agnóstico de fabricante</span></div>
</div>
<script>
(()=>{const BASE={{ ingress_path|tojson }},$=id=>document.getElementById(id),api=p=>BASE+p;let portfolio=null,currentId=null;
const T={
'pt-BR':{title:'Infrastructure Thermal Analytics',subtitle:'Saúde térmica, ventilação, energia e comportamento da infraestrutura no mesmo contexto operacional.',refresh:'Atualizar',infra:'Infraestrutura monitorada',back:'← Visão geral',agnostic:'Modelo analítico agnóstico de fabricante',systems:'Sistemas',normal:'Normais',attention:'Atenção',critical:'Críticos',latest:'Última telemetria',ambient:'Ambiente',intake:'Entrada de ar',cpu:'CPU mais quente',exhaust:'Exaustão',power:'Potência',fan:'Ventilação média',state:'Estado',details:'Abrir análise',thermalPath:'Caminho térmico',deltas:'Deltas térmicos',sensors:'Sensores e telemetria',sensor:'Sensor',context:'Contexto',reading:'Leitura',health:'Saúde',threshold:'Próximo limite',history:'Evolução térmica',noData:'Nenhuma telemetria ITA recebida ainda.',ambientIntake:'Ambiente → entrada',intakeCpu:'Entrada → CPU',intakeExhaust:'Entrada → exaustão',native:'Limites nativos do equipamento preservados como evidência.',updated:'Atualizado',normalState:'Normal',attentionState:'Atenção',criticalState:'Crítico'},
'en-US':{title:'Infrastructure Thermal Analytics',subtitle:'Thermal health, airflow, energy and infrastructure behavior in the same operational context.',refresh:'Refresh',infra:'Monitored infrastructure',back:'← Overview',agnostic:'Vendor-agnostic analytical model',systems:'Systems',normal:'Normal',attention:'Attention',critical:'Critical',latest:'Latest telemetry',ambient:'Ambient',intake:'Air intake',cpu:'Hottest CPU',exhaust:'Exhaust',power:'Power',fan:'Average fan',state:'State',details:'Open analysis',thermalPath:'Thermal path',deltas:'Thermal deltas',sensors:'Sensors and telemetry',sensor:'Sensor',context:'Context',reading:'Reading',health:'Health',threshold:'Next threshold',history:'Thermal evolution',noData:'No ITA telemetry received yet.',ambientIntake:'Ambient → intake',intakeCpu:'Intake → CPU',intakeExhaust:'Intake → exhaust',native:'Native equipment thresholds are preserved as evidence.',updated:'Updated',normalState:'Normal',attentionState:'Attention',criticalState:'Critical'}};
const lang=()=>window.SeidenUXLocale?window.SeidenUXLocale():'pt-BR',tr=k=>(T[lang()]||T['pt-BR'])[k]||k,n=(v,d=1)=>v==null?'—':Number(v).toLocaleString(lang(),{maximumFractionDigits:d}),temp=v=>v==null?'—':n(v,1)+' °C',power=v=>v==null?'—':n(v,0)+' W',pct=v=>v==null?'—':n(v,0)+' %';
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n))}
function stateLabel(s){return s==='critical'?tr('criticalState'):s==='attention'?tr('attentionState'):tr('normalState')}
function fmtTime(v){return v?new Date(v).toLocaleString(lang()):'—'}
function metric(label,value,note=''){return `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${note?`<div class="kpi-note">${note}</div>`:''}</div>`}
function renderOverview(d){portfolio=d;$('kpis').innerHTML=metric(tr('systems'),d.total)+metric(tr('normal'),d.counts?.normal||0)+metric(tr('attention'),d.counts?.attention||0)+metric(tr('critical'),d.counts?.critical||0);$('updated').textContent=`${tr('updated')} ${fmtTime(d.updated_at)}`;const items=d.items||[];$('systems').innerHTML=items.length?items.map(x=>{const s=x.system;return `<div class="card system-card" data-system="${encodeURIComponent(s.system_id)}"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="system-name">${escapeHtml(s.system_name)}</div><div class="system-meta">${escapeHtml(s.connection_name||s.connector||'')}</div></div><span class="state ${x.state}"><span class="dot"></span>${stateLabel(x.state)}</span></div><div class="metrics"><div class="metric"><span>${tr('intake')}</span><b>${temp(x.intake_c)}</b></div><div class="metric"><span>${tr('cpu')}</span><b>${temp(x.cpu_c)}</b></div><div class="metric"><span>${tr('exhaust')}</span><b>${temp(x.exhaust_c)}</b></div><div class="metric"><span>${tr('power')}</span><b>${power(x.power_w)}</b></div></div><div class="system-meta" style="margin-top:12px">${tr('latest')}: ${fmtTime(s.last_seen)} · ${tr('details')} →</div></div>`}).join(''):`<div class="card empty">${tr('noData')}</div>`;document.querySelectorAll('[data-system]').forEach(el=>el.onclick=()=>openSystem(decodeURIComponent(el.dataset.system)))}
function thresholdInfo(m){const th=m.thresholds||{};const keys=['UpperCaution','UpperCritical','UpperFatal','LowerCaution','LowerCritical'];for(const k of keys){const r=th[k]?.reading;if(r!=null)return `${k.replace('Upper','↑ ').replace('Lower','↓ ')} ${n(r,1)} ${m.units||''}`;}return '—'}
async function openSystem(id){currentId=id;const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/current'),{cache:'no-store'});if(!r.ok)return;const d=await r.json();$('overview').style.display='none';$('detail').classList.add('active');const s=d.system,del=d.deltas||{};$('detailBody').innerHTML=`<div class="section-head"><div><h2 style="font-size:22px;margin:0">${escapeHtml(s.system_name)}</h2><div class="muted">${escapeHtml(s.system_id)} · ${escapeHtml(s.connection_name||'')} · ${fmtTime(s.last_seen)}</div></div><span class="state ${d.state}"><span class="dot"></span>${stateLabel(d.state)}</span></div><div class="notice">${tr('native')}</div><div class="section"><div class="section-head"><h2>${tr('thermalPath')}</h2></div><div class="thermal-path"><div class="thermal-node"><span>${tr('ambient')}</span><strong>${temp(d.ambient_c)}</strong></div><div class="thermal-node"><span>${tr('intake')}</span><strong>${temp(d.intake_c)}</strong></div><div class="thermal-node"><span>${tr('cpu')}</span><strong>${temp(d.cpu_c)}</strong></div><div class="thermal-node"><span>${tr('exhaust')}</span><strong>${temp(d.exhaust_c)}</strong></div></div><div class="delta-row"><div class="delta"><span class="muted">${tr('ambientIntake')}</span><br><b>${temp(del.ambient_to_intake_c)}</b></div><div class="delta"><span class="muted">${tr('intakeCpu')}</span><br><b>${temp(del.intake_to_cpu_c)}</b></div><div class="delta"><span class="muted">${tr('intakeExhaust')}</span><br><b>${temp(del.intake_to_exhaust_c)}</b></div></div></div><div class="section grid">${metric(tr('power'),power(d.power_w))}${metric(tr('fan'),pct(d.fan_avg_pct))}${metric(tr('state'),stateLabel(d.state))}${metric(tr('latest'),fmtTime(s.last_seen))}</div><div class="section"><div class="section-head"><h2>${tr('history')}</h2></div><div class="card"><div id="chart" class="chart"></div><div id="legend" class="legend"></div></div></div><div class="section"><div class="section-head"><h2>${tr('sensors')}</h2></div><div class="card table-wrap"><table class="sensor-table"><thead><tr><th>${tr('sensor')}</th><th>${tr('context')}</th><th>${tr('reading')}</th><th>${tr('health')}</th><th>${tr('threshold')}</th></tr></thead><tbody>${(d.measurements||[]).map(m=>`<tr><td><b>${escapeHtml(m.sensor_name)}</b><div class="muted">${escapeHtml(m.sensor_id)}</div></td><td>${escapeHtml(m.physical_context)}</td><td>${n(m.reading,1)} ${escapeHtml(m.units||'')}</td><td><span class="pill ${m.severity}">${escapeHtml(m.health||'—')}</span></td><td>${escapeHtml(thresholdInfo(m))}</td></tr>`).join('')}</tbody></table></div></div>`;loadHistory(id)}
async function loadHistory(id){const h=$('period').value;const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/history?hours='+h),{cache:'no-store'});if(!r.ok)return;const d=await r.json();drawChart(d.items||[])}
function drawChart(items){const el=$('chart'),legend=$('legend');if(!el)return;const temps=items.filter(x=>x.metric_kind==='temperature'&&['room','intake','cpu','exhaust'].includes(String(x.physical_context).toLowerCase()));if(!temps.length){el.innerHTML=`<div class="empty">${tr('noData')}</div>`;legend.innerHTML='';return}const groups={};for(const x of temps){const key=x.physical_context;groups[key]=(groups[key]||[]);groups[key].push(x)}const all=temps.map(x=>({t:+new Date(x.occurred_at),v:+x.reading}));const minT=Math.min(...all.map(x=>x.t)),maxT=Math.max(...all.map(x=>x.t)),minV=Math.floor(Math.min(...all.map(x=>x.v))-2),maxV=Math.ceil(Math.max(...all.map(x=>x.v))+2),W=900,H=210,p=28,x=t=>p+(t-minT)/(Math.max(1,maxT-minT))*(W-2*p),y=v=>H-p-(v-minV)/(Math.max(1,maxV-minV))*(H-2*p);let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="currentColor" opacity=".18"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="currentColor" opacity=".18"/>`;Object.entries(groups).forEach(([k,arr],i)=>{arr.sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at));const pts=arr.map(a=>`${x(+new Date(a.occurred_at))},${y(+a.reading)}`).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="${2+i*.35}" opacity="${.9-i*.12}" vector-effect="non-scaling-stroke"/>`});svg+=`<text x="4" y="${p+4}" fill="currentColor" opacity=".55" font-size="11">${maxV}°</text><text x="4" y="${H-p}" fill="currentColor" opacity=".55" font-size="11">${minV}°</text></svg>`;el.innerHTML=svg;legend.innerHTML=Object.keys(groups).map(k=>`<span>• ${escapeHtml(k)}</span>`).join('')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function refresh(){applyI18n();if(currentId&&$('detail').classList.contains('active'))return openSystem(currentId);const r=await fetch(api('/api/v1/ita/portfolio'),{cache:'no-store'});if(r.ok)renderOverview(await r.json())}
$('refresh').onclick=refresh;$('period').onchange=()=>currentId?loadHistory(currentId):null;$('back').onclick=()=>{currentId=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};window.addEventListener('storage',()=>{applyI18n();refresh()});applyI18n();refresh();setInterval(refresh,30000)})();
</script>{% include '_global_ux.html' %}</body></html>
