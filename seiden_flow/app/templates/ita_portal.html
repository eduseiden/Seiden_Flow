d:var(--card)}.insight strong{font-size:20px;display:block;margin-top:3px}.insight .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}.insight .note{font-size:12px;color:var(--muted);margin-top:4px}.trend{font-weight:700}.trend.rising{color:var(--warn)}.trend.falling{color:var(--good)}.trend.stable{color:var(--muted)}.asset-manage{display:grid;grid-template-columns:minmax(170px,220px) 1fr auto;gap:10px;align-items:end}.asset-manage label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:5px}.asset-manage input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}.asset-badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:700;color:var(--muted)}.asset-badge.hidden{color:var(--warn)}.asset-badge.decommissioned{color:var(--bad)}

wDecommissioned:'Descomissionados',assetStatus:'Status do ativo',assetActive:'Ativo',assetHidden:'Oculto',assetDecommissioned:'Descomissionado',statusReason:'Motivo / observação',saveStatus:'Salvar status',statusSaved:'Status atualizado',manageAsset:'Gestão do ativo',assetHistoryNotice:'O histórico é preservado independentemente do status do ativo.',assetStatusChanged:'Status do ativo alterado',confirmStatus:'Confirmar alteração de status deste ativo?',statusSaveError:'Não foi possível atualizar o status.'},

ioned',statusReason:'Reason / note',saveStatus:'Save status',statusSaved:'Status updated',manageAsset:'Asset management',assetHistoryNotice:'History is preserved regardless of asset status.',assetStatusChanged:'Asset status changed',confirmStatus:'Confirm this asset status change?',statusSaveError:'Could not update asset status.'}};

function renderOverview(d){$('kpis').innerHTML=metric(tr('systems'),d.total)+metric(tr('normal'),d.counts?.normal||0)+metric(tr('attention'),d.counts?.attention||0)+metric(tr('critical'),d.counts?.critical||0)+metric(tr('stale'),d.counts?.stale||0);$('updated').textContent=`${tr('updated')} ${fmtTime(d.updated_at)}`;const items=d.items||[];$('systems').innerHTML=items.length?items.map(x=>{const s=x.system,h=x.thermal_headroom;return `<div class="card system-card" data-system="${encodeURIComponent(s.system_id)}"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="system-name">${escapeHtml(s.system_name)}</div><div class="system-meta">${escapeHtml(s.connection_name||s.connector||'')}${s.status&&s.status!=='active'?` · <span class="asset-badge ${s.status}">${assetStatusLabel(s.status)}</span>`:''}</div></div><span class="state ${x.state}"><span class="dot"></span>${stateLabel(x.state)}</span></div><div class="metrics"><div class="metric"><span>${tr('intake')}</span><b>${temp(x.intake_c)}</b></div><div class="metric"><span>${tr('cpu')}</span><b>${temp(x.cpu_c)}</b></div><div class="metric"><span>${tr('headroom')}</span><b>${h?temp(h.headroom):'—'}</b></div><div class="metric"><span>${tr('power')}</span><b>${power(x.power_w)}</b></div></div><div class="system-meta" style="margin-top:12px">${tr('latest')}: ${fmtTime(s.last_seen)} · ${tr('details')} →</div></div>`}).join(''):`<div class="card empty">${tr('noData')}</div>`;document.querySelectorAll('[data-system]').forEach(el=>el.onclick=()=>openSystem(decodeURIComponent(el.dataset.system)))}

function headroomText(h){if(!h)return '—';const label=h.label==='critical'?tr('toCritical'):h.label==='fatal'?tr('toFatal'):tr('toCaution');return `${temp(h.headroom)} ${label}`}
function trendText(t){if(!t||t.direction==='insufficient')return tr('insufficient');return `${tr(t.direction)}${t.delta_c==null?'':` (${t.delta_c>0?'+':''}${n(t.delta_c,1)} °C)`}`}

async function openSystem(id){currentId=id;const [cr,er]=await Promise.all([fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/current'),{cache:'no-store'}),fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/events?limit=50'),{cache:'no-store'})]);if(!cr.ok)return;const d=await cr.json(),ev=er.ok?await er.json():{items:[]};$('overview').style.display='none';$('detail').classList.add('active');const s=d.system,del=d.deltas||{},f=d.freshness||{},trends=d.trends||{};const freshnessNote=f.stale?tr('staleState'):`${tr('fresh')} · ${tr('age')} ${n(f.age_seconds,0)} ${tr('seconds')}`;$('detailBody').innerHTML=`<div class="section-head"><div><h2 style="font-size:22px;margin:0">${escapeHtml(s.system_name)}</h2><div class="muted">${escapeHtml(s.system_id)} · ${escapeHtml(s.connection_name||'')} · ${fmtTime(s.last_seen)}</div></div><span class="state ${d.state}"><span class="dot"></span>${stateLabel(d.state)}</span></div>${f.stale?`<div class="notice warn">${tr('staleState')} · ${tr('age')} ${n(f.age_seconds,0)} ${tr('seconds')}</div>`:''}<div class="notice">${tr('native')}</div><div class="section card"><div class="section-head"><h2>${tr('manageAsset')}</h2><span class="asset-badge ${s.status||'active'}">${assetStatusLabel(s.status||'active')}</span></div><div class="asset-manage"><div><label>${tr('assetStatus')}</label><select id="assetStatusControl"><option value="active" ${(s.status||'active')==='active'?'selected':''}>${tr('assetActive')}</option><option value="hidden" ${s.status==='hidden'?'selected':''}>${tr('assetHidden')}</option><option value="decommissioned" ${s.status==='decommissioned'?'selected':''}>${tr('assetDecommissioned')}</option></select></div><div><label>${tr('statusReason')}</label><input id="assetStatusReason" maxlength="500" value="${escapeHtml(s.status_reason||'')}" placeholder="${tr('statusReason')}"></div><button id="saveAssetStatus">${tr('saveStatus')}</button></div><div class="kpi-note" style="margin-top:8px">${tr('assetHistoryNotice')}</div></div><div class="section"><div class="section-head"><h2>${tr('thermalPath')}</h2></div><div class="thermal-path"><div class="thermal-node"><span>${tr('ambient')}</span><strong>${temp(d.ambient_c)}</strong></div><div class="thermal-node"><span>${tr('intake')}</span><strong>${temp(d.intake_c)}</strong></div><div class="thermal-node"><span>${tr('cpu')}</span><strong>${temp(d.cpu_c)}</strong></div><div class="thermal-node"><span>${tr('exhaust')}</span><strong>${temp(d.exhaust_c)}</strong></div></div><div class="delta-row"><div class="delta"><span class="muted">${tr('ambientIntake')}</span><br><b>${temp(del.ambient_to_intake_c)}</b></div><div class="delta"><span class="muted">${tr('intakeCpu')}</span><br><b>${temp(del.intake_to_cpu_c)}</b></div><div class="delta"><span class="muted">${tr('intakeExhaust')}</span><br><b>${temp(del.intake_to_exhaust_c)}</b></div></div></div><div class="section insight-grid"><div class="insight"><div class="label">${tr('headroom')}</div><strong>${headroomText(d.thermal_headroom)}</strong><div class="note">${d.thermal_headroom?`${n(d.thermal_headroom.threshold_value,1)} ${d.thermal_headroom.units||''}`:'—'}</div></div><div class="insight"><div class="label">${tr('powerUse')}</div><strong>${pct(d.power_utilization_pct)}</strong><div class="note">${power(d.power_w)}${d.power_utilization_pct!=null?` · ${tr('range')}`:''}</div></div><div class="insight"><div class="label">${tr('fanSpread')}</div><strong>${pct(d.fan_spread_pct)}</strong><div class="note">${tr('fanRange')}: ${pct(d.fan_min_pct)} → ${pct(d.fan_max_pct)}</div></div><div class="insight"><div class="label">${tr('freshness')}</div><strong>${f.stale?tr('staleState'):tr('fresh')}</strong><div class="note">${freshnessNote}</div></div></div><div class="section"><div class="section-head"><h2>${tr('trend')}</h2></div><div class="insight-grid"><div class="insight"><div class="label">${tr('cpuTrend')}</div><strong class="trend ${trendClass(trends.cpu)}">${trendText(trends.cpu)}</strong></div><div class="insight"><div class="label">${tr('intakeTrend')}</div><strong class="trend ${trendClass(trends.intake)}">${trendText(trends.intake)}</strong></div><div class="insight"><div class="label">${tr('exhaustTrend')}</div><strong class="trend ${trendClass(trends.exhaust)}">${trendText(trends.exhaust)}</strong></div><div class="insight"><div class="label">${tr('ambientTrend')}</div><strong class="trend ${trendClass(trends.ambient)}">${trendText(trends.ambient)}</strong></div></div></div><div class="section grid">${metric(tr('power'),power(d.power_w),d.power_utilization_pct!=null?pct(d.power_utilization_pct)+' '+tr('range'):'')}${metric(tr('fan'),pct(d.fan_avg_pct),d.fan_spread_pct!=null?tr('fanSpread')+': '+pct(d.fan_spread_pct):'')}${metric(tr('state'),stateLabel(d.state))}${metric(tr('latest'),fmtTime(s.last_seen))}</div><div class="section"><div class="section-head"><h2>${tr('history')}</h2></div><div class="card"><div id="chart" class="chart"></div><div id="legend" class="legend"></div></div></div><div class="section"><div class="section-head"><h2>${tr('events')}</h2></div><div class="card table-wrap">${(ev.items||[]).length?`<table class="event-table"><thead><tr><th>${tr('when')}</th><th>${tr('event')}</th><th>${tr('sensor')}</th><th>${tr('transition')}</th></tr></thead><tbody>${ev.items.map(e=>`<tr><td>${fmtTime(e.occurred_at)}</td><td><span class="pill ${e.severity}">${escapeHtml(eventName(e.event_type))}</span></td><td>${escapeHtml(e.sensor_name||e.sensor_id||'—')}</td><td>${escapeHtml(e.previous_state||'—')} → ${escapeHtml(e.current_state||'—')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${tr('noEvents')}</div>`}</div></div><div class="section"><div class="section-head"><h2>${tr('sensors')}</h2></div><div class="card table-wrap"><table class="sensor-table"><thead><tr><th>${tr('sensor')}</th><th>${tr('context')}</th><th>${tr('reading')}</th><th>${tr('health')}</th><th>${tr('threshold')}</th></tr></thead><tbody>${(d.measurements||[]).map(m=>`<tr><td><b>${escapeHtml(m.sensor_name)}</b><div class="muted">${escapeHtml(m.sensor_id)}</div></td><td>${escapeHtml(m.physical_context)}</td><td>${n(m.reading,1)} ${escapeHtml(m.units||'')}</td><td><span class="pill ${m.severity}">${escapeHtml(m.health||'—')}</span></td><td>${escapeHtml(thresholdInfo(m))}</td></tr>`).join('')}</tbody></table></div></div>`;const saveBtn=$('saveAssetStatus');if(saveBtn)saveBtn.onclick=()=>saveAssetStatus(id);loadHistory(id)}
async function saveAssetStatus(id){const status=$('assetStatusControl')?.value||'active',reason=$('assetStatusReason')?.value||'';if(!confirm(tr('confirmStatus')))return;const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/asset-status'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});if(!r.ok){alert(tr('statusSaveError'));return}await openSystem(id);}
async function loadHistory(id){const h=$('period').value;const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/history?hours='+h),{cache:'no-store'});if(!r.ok)return;const d=await r.json();drawChart(d.items||[])}
function drawChart(items){const el=$('chart'),legend=$('legend');if(!el)return;const temps=items.filter(x=>x.metric_kind==='temperature'&&['room','intake','cpu','exhaust'].includes(String(x.physical_context).toLowerCase()));if(!temps.length){el.innerHTML=`<div class="empty">${tr('noData')}</div>`;legend.innerHTML='';return}const groups={};for(const x of temps){const key=x.physical_context;groups[key]=(groups[key]||[]);groups[key].push(x)}const all=temps.map(x=>({t:+new Date(x.occurred_at),v:+x.reading}));const minT=Math.min(...all.map(x=>x.t)),maxT=Math.max(...all.map(x=>x.t)),minV=Math.floor(Math.min(...all.map(x=>x.v))-2),maxV=Math.ceil(Math.max(...all.map(x=>x.v))+2),W=900,H=220,p=32,x=t=>p+(t-minT)/(Math.max(1,maxT-minT))*(W-2*p),y=v=>H-p-(v-minV)/(Math.max(1,maxV-minV))*(H-2*p);let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="currentColor" opacity=".18"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="currentColor" opacity=".18"/>`;const dash=['','8 4','3 3','12 4 3 4'];Object.entries(groups).forEach(([k,arr],i)=>{arr.sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at));const pts=arr.map(a=>`${x(+new Date(a.occurred_at))},${y(+a.reading)}`).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="${2.2+i*.25}" stroke-dasharray="${dash[i%dash.length]}" opacity="${.92-i*.1}" vector-effect="non-scaling-stroke"/>`});svg+=`<text x="4" y="${p+4}" fill="currentColor" opacity=".55" font-size="11">${maxV}°</text><text x="4" y="${H-p}" fill="currentColor" opacity=".55" font-size="11">${minV}°</text></svg>`;el.innerHTML=svg;legend.innerHTML=Object.keys(groups).map((k,i)=>`<span>${i===0?'━':i===1?'┄':i===2?'┈':'╍'} ${escapeHtml(k)}</span>`).join('')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function refresh(){applyI18n();if(currentId&&$('detail').classList.contains('active'))return openSystem(currentId);const view=$('assetView')?.value||'active';const r=await fetch(api('/api/v1/ita/portfolio?view='+encodeURIComponent(view)),{cache:'no-store'});if(r.ok)renderOverview(await r.json())}
$('refresh').onclick=refresh;$('assetView').onchange=()=>{currentId=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};$('period').onchange=()=>currentId?loadHistory(currentId):null;$('back').onclick=()=>{currentId=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};window.addEventListener('storage',()=>{applyI18n();refresh()});applyI18n();refresh();setInterval(refresh,30000)})();
</script>{% include '_global_ux.html' %}</body></html>
