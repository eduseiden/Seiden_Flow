-label,.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.kpi-value{font-size:28px;font-weight:770;margin-top:5px}.detail{display:none}.detail.active{display:block}.back{margin-bottom:12px}.cap-strip{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}.cap{padding:5px 9px;background:var(--soft);border-radius:999px;font-size:11px;font-weight:700}.cap.off{opacity:.4}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.category{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.category h3{font-size:15px;margin:0 0 12px}.category-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kv{background:var(--soft);border-radius:11px;padding:11px}.kv span{display:block;color:var(--muted);font-size:11px}.kv strong{font-size:18px}.thermal-path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.thermal-node{background:var(--soft);padding:14px;border-radius:14px}.thermal-node strong{font-size:22px;display:block}.thermal-node span{font-size:12px;color:var(--muted)}.delta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.delta{border:1px solid var(--line);border-radius:12px;padding:12px}.notice{padding:12px 14px;background:var(--soft);border-radius:12px;color:var(--muted);margin-bottom:14px}.notice.warn{color:var(--warn);font-weight:650}.table-wrap{overflow:auto}.sensor-table,.event-table{width:100%;border-collapse:collapse}.sensor-table th,.sensor-table td,.event-table th,.event-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.sensor-table th,.event-table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.pill{padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:700}.pill.attention{color:var(--warn)}.pill.critical{color:var(--bad)}.empty{padding:30px;text-align:center;color:var(--muted)}.asset-manage{display:grid; .source-badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;margin-top:7px}
.source-badge.pulse{color:var(--good)}
.source-badge.bridge{color:var(--muted)}
.platform-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.platform-item{background:var(--soft);border-radius:11px;padding:11px}
.platform-item span{display:block;color:var(--muted);font-size:11px}
.platform-item strong{font-size:16px;display:block;margin-top:3px}
.alert-list{display:grid;gap:9px}
.alert-item{border:1px solid var(--line);border-radius:12px;padding:12px}
.unified-note{margin:0 0 14px}
@media(max-width:780px){.platform-list{grid-template-columns:1fr}}

.cap-strip{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cap{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:700;color:var(--muted)}
.metric-note{font-size:10px;color:var(--muted);margin-top:3px}
.metric.emphasis strong,.metric.emphasis b{font-size:19px}
.state-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.app-state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.app-state .mini-dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.app-state.stopped{color:var(--muted)}
.app-state.stopped .mini-dot{background:var(--muted)}
.diag-details{border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}
.diag-details summary{cursor:pointer;list-style:none;padding:15px 17px;font-weight:750;display:flex;justify-content:space-between;align-items:center}
.diag-details summary::-webkit-details-marker{display:none}
.diag-details summary:after{content:"+";font-size:18px;color:var(--muted)}
.diag-details[open] summary:after{content:"–"}
.diag-body{padding:0 17px 17px}
.source-note{font-size:10px;color:var(--muted);margin-top:4px}
.platform-item{border:1px solid transparent}
.platform-item:hover{border-color:var(--line)}


.lifecycle-badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:750;margin-left:6px}
.lifecycle-badge.hidden{color:var(--muted)}
.lifecycle-badge.decommissioned{color:var(--muted);border-style:dashed}
.danger-zone{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.danger-btn{border:1px solid #dc6666;background:transparent;color:#b42318;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.danger-btn:hover{background:#fff1f0}
.danger-help{display:block;color:var(--muted);font-size:11px;margin-top:7px;max-width:760px}

.incident-banner{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0;background:var(--card)}
.incident-banner.critical{border-color:#e49b9b}
.incident-banner.warning{border-color:#e8c777}
.incident-title{font-weight:800;font-size:15px}
.incident-list{display:grid;gap:8px;margin-top:10px}
.incident-item{background:var(--soft);border-radius:10px;padding:10px 12px}
.incident-item strong{display:block;font-size:13px}
.incident-item span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.summary-line{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:9px;color:var(--muted);font-size:12px}
.summary-line strong{color:var(--text)}
.collapsible-admin{border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}
.collapsible-admin summary{cursor:pointer;list-style:none;padding:15px 17px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.collapsible-admin summary::-webkit-details-marker{display:none}
.collapsible-admin summary:after{content:"+";font-size:18px;color:var(--muted)}
.collapsible-admin[open] summary:after{content:"–"}
.collapsible-admin-body{padding:0 17px 17px}

.device-impact-list{display:grid;gap:7px;margin-top:9px}
.device-impact-item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.device-impact-main{min-width:0}
.device-impact-name{font-weight:750;font-size:12px;overflow-wrap:anywhere}
.device-impact-meta{color:var(--muted);font-size:10px;margin-top:2px;overflow-wrap:anywhere}
.device-impact-kind{font-size:10px;font-weight:750;color:var(--muted);white-space:nowrap}
.device-impact-more{font-size:11px;color:var(--muted);padding:2px 4px}
.zigbee-impact{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.zigbee-impact-title{font-size:11px;font-weight:800;margin-bottom:7px}

<body><div class="wrap">
<div class="top">
  <div>
    <div class="eyebrow">Seiden One · ITA</div>
    <div class="title" data-i18n="title">Infrastructure Telemetry Analytics</div>
    <div class="subtitle" data-i18n="subtitle">Saúde operacional unificada de servidores, hosts e ambientes Seiden CAST.</div>
  </div>
  <div class="toolbar">
    <select id="assetView">
      <option value="active" data-i18n="viewActive">Ativos</option>
      <option value="all" data-i18n="viewAll">Todos</option>
      <option value="hidden" data-i18n="viewHidden">Ocultos</option>
      <option value="decommissioned" data-i18n="viewDecommissioned">Descomissionados</option>
    </select>
    <select id="period">
      <option value="1">1 h</option><option value="6">6 h</option><option value="24" selected>24 h</option>
      <option value="168">7 d</option><option value="720">30 d</option>
    </select>
    <button id="refresh" data-i18n="refresh">Atualizar</button>
  </div>
</div>

<div id="receiverNotice" class="notice warn unified-note" style="display:none"></div>

<div id="overview">
  <div class="grid5" id="kpis"></div>
  <div class="section">
    <div class="section-head"><h2 data-i18n="infra">Infraestrutura monitorada</h2><span id="updated" class="muted"></span></div>
    <div id="systems" class="systems"></div>
  </div>
</div>

<div id="detail" class="detail">
  <button class="back" id="back" data-i18n="back">← Visão geral</button>
  <div id="detailBody"></div>
</div>

<div class="footer">Seiden Flow {{ version }} · ITA 0.3.1.4 · <span data-i18n="agnostic">Modelo adaptativo e agnóstico de fabricante</span></div>
</div>

function bytes(v){if(v==null)return'—';let x=Number(v),u=['B','KB','MB','GB','TB'],i=0;while(Math.abs(x)>=1024&&i<u.length-1){x/=1024;i++}return n(x,i?1:0)+' '+u[i]}
function duration(v){if(v==null)return'—';let s=Number(v),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d?`${n(d,0)} d ${n(h,0)} h`:h?`${n(h,0)} h ${n(m,0)} min`:`${n(m,0)} min`}
function fmtTime(v){if(!v)return'—';try{return new Intl.DateTimeFormat(lang(),{dateStyle:'short',timeStyle:'medium'}).format(new Date(v))}catch{return v}}
function relativeTime(v){
 if(!v)return'—';
 const diff=Math.max(0,Date.now()-new Date(v).getTime()),s=Math.floor(diff/1000);
 if(s<60)return `${tr('ago')} ${s} s`;
 const m=Math.floor(s/60);if(m<60)return `${tr('ago')} ${m} min`;
 const h=Math.floor(m/60);if(h<24)return `${tr('ago')} ${h} h`;
 return `${tr('ago')} ${Math.floor(h/24)} d`;
}
function priorityFor(x){
 if(x.state==='critical')return 0;
 if(x.state==='attention')return 10;
 if(x.state==='stale')return 20;
 return 50;
}

function deviceTypeLabel(t){
 const s=String(t||'').toLowerCase();
 if(s.includes('router'))return tr('deviceRouter');
 if(s.includes('end'))return tr('deviceEnd');
 return tr('deviceUnknown');
}
function deviceLabel(d){
 return d?.friendly_name||d?.device_key||d?.ieee||tr('deviceUnknown');
}
function deviceImpactRows(devices,kind,limit=5){
 const list=Array.isArray(devices)?devices:[];
 if(!list.length)return'';
 const shown=list.slice(0,limit);
 const rows=shown.map(d=>`<div class="device-impact-item">
   <div class="device-impact-main">
     <div class="device-impact-name">${escapeHtml(deviceLabel(d))}</div>
     <div class="device-impact-meta">${escapeHtml(deviceTypeLabel(d.type))}${d.ieee?` · ${tr('ieeeLabel')} ${escapeHtml(d.ieee)}`:''}${d.model?` · ${escapeHtml(d.model)}`:''}</div>
   </div>
   <div class="device-impact-kind">${escapeHtml(kind)}</div>
 </div>`).join('');
 const extra=list.length-shown.length;
 return `<div class="device-impact-list">${rows}${extra>0?`<div class="device-impact-more">+ ${extra} ${tr('moreDevices')}</div>`:''}</div>`;
}
function alertDeviceDetails(alert){
 const d=alert?.details||{};
 let html='';
 html+=deviceImpactRows(d.missing_devices_detail,tr('deviceMissing'));
 html+=deviceImpactRows(d.offline_devices_detail,tr('deviceOffline'));
 html+=deviceImpactRows(d.new_devices_detail,tr('deviceNew'));
 return html;
}
function zigbeeAlertImpact(alerts){
 const missing=[],offline=[],newdev=[];
 for(const a of alerts||[]){
   const d=a?.details||{};
   if(Array.isArray(d.missing_devices_detail))missing.push(...d.missing_devices_detail);
   if(Array.isArray(d.offline_devices_detail))offline.push(...d.offline_devices_detail);
   if(Array.isArray(d.new_devices_detail))newdev.push(...d.new_devices_detail);
 }
 const seen=new Set(),uniq=arr=>arr.filter(d=>{const k=d?.ieee||d?.device_key||d?.friendly_name||JSON.stringify(d);if(seen.has(k))return false;seen.add(k);return true});
 const m=uniq(missing),o=uniq(offline),n=uniq(newdev);
 if(!m.length&&!o.length&&!n.length)return'';
 return `<div class="zigbee-impact"><div class="zigbee-impact-title">${tr('zigbeeAffected')}</div>${deviceImpactRows(m,tr('deviceMissing'))}${deviceImpactRows(o,tr('deviceOffline'))}${deviceImpactRows(n,tr('deviceNew'))}</div>`;
}
function stateLabel(s){return s==='critical'?tr('criticalState'):s==='attention'?tr('attentionState'):s==='stale'?tr('staleState'):tr('normalState')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function applyI18n(){document.documentElement.lang=lang();document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n))}
function fmtCard(c){if(!c)return'—';if(c.format==='percent')return pct(c.value);if(c.format==='temperature'||c.format==='temperature_delta')return temp(c.value);if(c.format==='power')return power(c.value);if(c.format==='duration')return duration(c.value);if(c.format==='integer')return n(c.value,0);if(c.format==='ratio')return String(c.value??'—');return n(c.value,2)}
function capLabel(k){
 const known={
   host:'capHost',host_uptime:'capHost',host_storage:'capHost',
   platform:'capRuntime',platform_runtime_stats:'capRuntime',
   apps:'capApps',backup:'capBackup',
   host_cpu_temperature:'capCpuTemp',
   zigbee:'capZigbee',zigbee_inventory_integrity:'capZigbee'
 };
 return tr(known[k]||k);
}
function capabilityChips(caps){
 const preferred=['capHost','capRuntime','capApps','capBackup','capCpuTemp','capZigbee'];
 const seen=new Set(),labels=[];
 (caps||[]).forEach(k=>{const label=capLabel(k);if(label&&!seen.has(label)){seen.add(label);labels.push(label)}});
 labels.sort((a,b)=>{
   const ka=preferred.findIndex(k=>tr(k)===a),kb=preferred.findIndex(k=>tr(k)===b);
   return (ka<0?99:ka)-(kb<0?99:kb);
 });
 return labels.map(label=>`<span class="cap">${escapeHtml(label)}</span>`).join('');
}
function kv(label,value,note=''){return`<div class="kv"><span>${label}</span><strong>${value}</strong>${note?`<span>${note}</span>`:''}</div>`}
function category(title,body){return body?`<div class="category"><h3>${title}</h3><div class="category-metrics">${body}</div></div>`:''}

function mapPulseState(a){
 if(a.connection_state==='offline')return'stale';
 if(a.connection_state==='degraded')return'attention';
 if(a.highest_alert_severity==='critical')return'critical';
 if(a.highest_alert_severity==='warning')return'attention';
 return'normal';
}
function pulseCards(a){
 const s=a.summary||{},h=s.host||{},z=s.zigbee||{},ap=s.apps||{},cards=[];
 if(h.cpu_temperature_available&&h.cpu_temperature_c!=null)cards.push({key:'cpuTemp',value:h.cpu_temperature_c,format:'temperature'});
 if(h.disk_used_percent!=null)cards.push({key:'disk',value:h.disk_used_percent,format:'percent'});
 if(h.uptime_seconds!=null)cards.push({key:'uptime',value:h.uptime_seconds,format:'duration'});
 if(z.available!==false&&z.total!=null)cards.push({key:'zigbee',value:`${z.online??'—'} / ${z.total}`,format:'ratio'});
 if(cards.length<4&&ap.total!=null)cards.push({key:'apps',value:`${ap.started??'—'} / ${ap.total}`,format:'ratio'});
 return cards.slice(0,4);
}
function normalizePulse(a){
 const s=a.summary||{},asset=s.asset||{};
 return{
   source:'pulse',id:a.pulse_id,state:mapPulseState(a),assetStatus:a.asset_status||'active',
   system:{system_id:a.pulse_id,system_name:a.asset_name||asset.name||a.hostname||a.pulse_id,
     connection_name:`${tr('pulseSource')} · ${asset.operating_system||'CAST'}${asset.architecture?' · '+asset.architecture:''}`,
     connector:'pulse',last_seen:a.last_seen_at},
   primary_cards:pulseCards(a),raw:a
 };
}
function normalizeLocal(x){return{source:'local',id:x.system.system_id,state:x.state,system:x.system,primary_cards:x.primary_cards||[],raw:x}}

     <span class="state ${x.state}"><span class="dot"></span>${stateLabel(x.state)}</span></div>
     <div class="metrics">${cards.map(c=>`<div class="metric"><span>${tr(c.key)}</span><b>${fmtCard(c)}</b></div>`).join('')}</div>

 document.querySelectorAll('.system-card').forEach(e=>e.onclick=()=>e.dataset.source==='pulse'?openPulse(e.dataset.id):openSystem(e.dataset.id));

function thresholdInfo(m){const th=m.thresholds||{},r=+m.reading,c=[];for(const [k,v] of Object.entries(th)){if(v&&v.reading!=null){const x=+v.reading;if((k.startsWith('Upper')&&x>r)||(k.startsWith('Lower')&&x<r))c.push([Math.abs(x-r),k,x])}}if(!c.length)return'—';c.sort((a,b)=>a[0]-b[0]);return`${c[0][1]} ${n(c[0][2],1)} ${m.units||''}`}
function eventName(v){return v==='sensor_state_changed'?(lang()==='en-US'?'Sensor state changed':'Mudança de estado do sensor'):v==='telemetry_recovered'?(lang()==='en-US'?'Telemetry recovered':'Telemetria recuperada'):v==='asset_status_changed'?(lang()==='en-US'?'Asset status changed':'Status do ativo alterado'):v}
function formatMeasurement(m){if(m.metric_kind?.endsWith('_bytes'))return bytes(m.reading);if(m.metric_kind?.endsWith('_pct')||m.metric_kind==='fan_speed')return pct(m.reading);if(m.metric_kind==='uptime_seconds')return duration(m.reading);if(m.metric_kind==='temperature')return temp(m.reading);if(m.metric_kind==='power')return power(m.reading);return`${n(m.reading,2)} ${escapeHtml(m.units||'')}`}

 if(c.power||c.cooling)cats+=category(tr('powerCooling'),(c.power?kv(tr('power'),power(d.power_w))+kv(tr('powerUse'),pct(d.power_utilization_pct)):'')+(c.cooling?kv(tr('fan_avg'),pct(d.fan_avg_pct))+kv(tr('fanSpread'),pct(d.fan_spread_pct)):''));
 const thermal=c.thermal?`<div class="section"><div class="section-head"><h2>${tr('thermalPath')}</h2></div><div class="thermal-path"><div class="thermal-node"><span>${tr('ambient')}</span><strong>${temp(d.ambient_c)}</strong></div><div class="thermal-node"><span>${tr('intake')}</span><strong>${temp(d.intake_c)}</strong></div><div class="thermal-node"><span>${tr('hottest_cpu')}</span><strong>${temp(d.cpu_c)}</strong></div><div class="thermal-node"><span>${tr('exhaust')}</span><strong>${temp(d.exhaust_c)}</strong></div></div><div class="delta-row"><div class="delta"><span class="muted">${tr('ambientIntake')}</span><br><b>${temp(d.deltas?.ambient_to_intake_c)}</b></div><div class="delta"><span class="muted">${tr('intakeCpu')}</span><br><b>${temp(d.deltas?.intake_to_cpu_c)}</b></div><div class="delta"><span class="muted">${tr('intakeExhaust')}</span><br><b>${temp(d.deltas?.intake_to_exhaust_c)}</b></div></div></div>`:'';
 $('detailBody').innerHTML=`<div class="section-head"><div><h2 style="font-size:22px;margin:0">${escapeHtml(s.system_name)}</h2><div class="muted">${escapeHtml(s.system_id)} · ${escapeHtml(s.connection_name||'')}</div><span class="source-badge bridge">${tr('bridgeSource')}</span><div class="cap-strip">${capabilityChips(Object.entries(c).filter(([,v])=>v).map(([k])=>k))}</div><div class="summary-line"><span><strong>${tr('healthLabel')}:</strong> ${stateLabel(d.state)}</span><span><strong>${tr('telemetryLabel')}:</strong> ${d.freshness?.stale?tr('telemetryStale'):tr('telemetryFresh')} · ${relativeTime(s.last_seen)}</span></div></div><span class="state ${d.state}"><span class="dot"></span>${stateLabel(d.state)}</span></div>

 $('detailBody').innerHTML=`

   <div class="summary-line"><span><strong>${tr('healthLabel')}:</strong> ${stateLabel(state)}</span><span><strong>${tr('telemetryLabel')}:</strong> ${a.connection_state==='healthy'?tr('telemetryFresh'):tr('telemetryStale')} · ${relativeTime(a.last_seen_at)}</span></div>
 </div><span class="state ${state}"><span class="dot"></span>${stateLabel(state)}</span></div>
 <div class="notice">${tr('latest')}: ${fmtTime(a.last_seen_at)} · ${tr('lastSnapshot')}: ${fmtTime(a.last_snapshot_at)} · ${tr('lastHeartbeat')}: ${fmtTime(a.last_heartbeat_at)}</div>
 ${alerts.length?`<div class="incident-banner ${a.highest_alert_severity==='critical'?'critical':'warning'}"><div class="incident-title">${tr('incidentTitle')} · ${alerts.length} ${tr('activeProblems')}</div><div class="incident-list">${alerts.map(x=>`<div class="incident-item"><strong>${escapeHtml(x.title||x.key)}</strong><span>${escapeHtml(x.severity||'warning')} · ${relativeTime(x.activated_at||x.updated_at)}</span>${alertDeviceDetails(x)}</div>`).join('')}</div></div>`:''}
 <div class="section"><div class="category-grid">
   ${hostBody?category(tr('hostHealth'),hostBody):''}
   ${zigbeeBody?category(tr('zigbee'),zigbeeBody+zigbeeAlertImpact(alerts)):''}
   ${appsBody?category(tr('apps'),appsBody):''}
   ${backupsBody?category(tr('backup'),backupsBody):''}
 </div></div>
 ${(rt.core||rt.supervisor||managedBody)?`<div class="section"><div class="section-head"><h2>${tr('platformRuntime')}</h2></div><div class="category-grid">
   ${rt.core?runtimeBlock(tr('coreRuntime'),rt.core):''}
   ${rt.supervisor?runtimeBlock(tr('supervisorRuntime'),rt.supervisor):''}
   ${managedBody}
 </div></div>`:''}
 ${ap.platform&&Object.keys(ap.platform).length?`<div class="section"><div class="section-head"><h2>${tr('appPlatform')}</h2></div><div class="card">${platformItems(ap.platform)}</div></div>`:''}
 ${perfBody?`<div class="section"><details class="diag-details"><summary><span>${tr('pulseDiagnostics')}</span><span class="muted">${tr('pulseVersion')} ${escapeHtml(a.pulse_version||'—')}</span></summary><div class="diag-body"><div class="category-grid">${category(tr('collectionPerformance'),perfBody)}</div></div></details></div>`:''}
 <div class="section"><details class="collapsible-admin"><summary>${tr('adminAsset')}</summary><div class="collapsible-admin-body">
   <div class="asset-manage"><div><label>${tr('assetStatus')}</label><select id="pulseAssetStatus"><option value="active" ${(a.asset_status||'active')==='active'?'selected':''}>${tr('assetActive')}</option><option value="hidden" ${a.asset_status==='hidden'?'selected':''}>${tr('assetHidden')}</option><option value="decommissioned" ${a.asset_status==='decommissioned'?'selected':''}>${tr('assetDecommissioned')}</option></select></div><div><label>${tr('statusReason')}</label><input id="pulseAssetReason" maxlength="500" value="${escapeHtml(a.asset_status_reason||'')}"></div><button id="savePulseAssetStatus">${tr('saveStatus')}</button></div>
   <div class="system-meta" style="margin-top:8px">${tr('assetHistoryNotice')}</div>
   <div class="danger-zone"><strong>${tr('deleteAssetTitle')}</strong><br><button id="deletePulseAsset" class="danger-btn" style="margin-top:9px">${tr('deleteAsset')}</button><span class="danger-help">${tr('deleteAssetHelp')}</span></div>
 </div></details></div>`;
 $('savePulseAssetStatus').onclick=()=>savePulseAssetStatus(id);
 $('deletePulseAsset').onclick=()=>deletePulseAsset(id);
}


async function savePulseAssetStatus(id){
 const status=$('pulseAssetStatus').value,reason=$('pulseAssetReason').value;
 const r=await fetch(api('/api/v1/ita/fleet/'+encodeURIComponent(id)+'/asset-status'),{
   method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})
 });
 if(!r.ok){alert(tr('statusSaveError'));return}
 await openPulse(id);
}

async function deletePulseAsset(id){
 const msg=tr('deleteConfirmPrompt').replace('{id}',id);
 const typed=prompt(msg,'');
 if(typed===null)return;
 if(typed!==id){alert(tr('deleteMismatch'));return}
 const r=await fetch(api('/api/v1/ita/fleet/'+encodeURIComponent(id)),{method:'DELETE'});
 if(!r.ok){alert(tr('deleteError'));return}
 currentId=null;currentSource=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh();
}

async function saveAssetStatus(id){
 const status=$('assetStatusControl').value,reason=$('assetStatusReason').value;
 if(!confirm(tr('confirmStatus')))return;
 const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/asset-status'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});
 if(!r.ok){alert(tr('statusSaveError'));return}openSystem(id)
}
async function loadHistory(id){const r=await fetch(api('/api/v1/ita/systems/'+encodeURIComponent(id)+'/history?hours='+$('period').value),{cache:'no-store'});if(r.ok)drawChart((await r.json()).items||[])}
function drawChart(items){
 const el=$('chart'),leg=$('legend');if(!el)return;
 let candidates=items.filter(x=>x.metric_kind==='temperature');
 if(!candidates.length)candidates=items.filter(x=>['memory_used_pct','swap_used_pct','storage_used_pct','cpu_used_pct','load'].includes(x.metric_kind));
 if(!candidates.length){el.innerHTML=`<div class="empty">${tr('noData')}</div>`;leg.innerHTML='';return}
 const groups={};for(const x of candidates){const k=x.sensor_name||x.sensor_id;(groups[k]||(groups[k]=[])).push(x)}
 const selected=Object.entries(groups).slice(0,5),all=selected.flatMap(([,a])=>a).map(x=>({t:+new Date(x.occurred_at),v:+x.reading}));
 const minT=Math.min(...all.map(x=>x.t)),maxT=Math.max(...all.map(x=>x.t)),minV=Math.floor(Math.min(...all.map(x=>x.v))-2),maxV=Math.ceil(Math.max(...all.map(x=>x.v))+2),W=900,H=220,p=32,X=t=>p+(t-minT)/Math.max(1,maxT-minT)*(W-2*p),Y=v=>H-p-(v-minV)/Math.max(1,maxV-minV)*(H-2*p);
 let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="currentColor" opacity=".18"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="currentColor" opacity=".18"/>`;
 const dash=['','8 4','3 3','12 4 3 4','2 5'];
 selected.forEach(([k,a],i)=>{a.sort((x,y)=>new Date(x.occurred_at)-new Date(y.occurred_at));svg+=`<polyline points="${a.map(x=>`${X(+new Date(x.occurred_at))},${Y(+x.reading)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="${2+i*.2}" stroke-dasharray="${dash[i]}" opacity="${.95-i*.1}" vector-effect="non-scaling-stroke"/>`});
 svg+=`<text x="4" y="${p+4}" fill="currentColor" opacity=".55" font-size="11">${maxV}</text><text x="4" y="${H-p}" fill="currentColor" opacity=".55" font-size="11">${minV}</text></svg>`;
 el.innerHTML=svg;leg.innerHTML=selected.map(([k],i)=>`<span>${i===0?'━':i===1?'┄':i===2?'┈':'╍'} ${escapeHtml(k)}</span>`).join('')
}

async function refresh(){
 applyI18n();
 if(currentId&&$('detail').classList.contains('active'))return currentSource==='pulse'?openPulse(currentId):openSystem(currentId);
 const view=$('assetView').value;
 const localPromise=fetch(api('/api/v1/ita/portfolio?view='+encodeURIComponent(view)),{cache:'no-store'});
 const includePulse=true;
 const pulsePromise=fetch(api('/api/v1/ita/fleet?view='+encodeURIComponent(view)),{cache:'no-store'});
 const [lr,pr]=await Promise.all([localPromise,pulsePromise]);

 let items=[],updatedAt=new Date().toISOString();
 if(lr&&lr.ok){
   const local=await lr.json();items.push(...(local.items||[]).map(normalizeLocal));updatedAt=local.updated_at||updatedAt;
 }
 const notice=$('receiverNotice');notice.style.display='none';
 if(includePulse&&pr){
   if(pr.ok){
     const fleet=await pr.json();items.push(...(fleet.assets||[]).map(normalizePulse));
     if(fleet.generated_at)updatedAt=fleet.generated_at;
   }else{
     let err={};try{err=await pr.json()}catch{}
     notice.textContent=err.error==='fleet_not_configured'?tr('receiverNotConfigured'):tr('receiverUnavailable');
     notice.style.display='block';
   }
 }
 renderOverview(items,updatedAt);
}

$('refresh').onclick=refresh;
$('assetView').onchange=()=>{currentId=null;currentSource=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};
$('period').onchange=()=>currentId&&currentSource==='local'?loadHistory(currentId):null;
$('back').onclick=()=>{currentId=null;currentSource=null;$('detail').classList.remove('active');$('overview').style.display='block';refresh()};
window.addEventListener('storage',()=>{applyI18n();refresh()});
applyI18n();refresh();setInterval(refresh,REFRESH);
})();
</script>
